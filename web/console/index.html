<!doctype html>
<html lang="en-JM" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hold My Spot — Staff Console</title>
<script src="env.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   HOLD MY SPOT — STAFF CONSOLE
   HMS-FE-001 design render · Igris · 2026-08-18
   Direction: Civic Ledger (structure) + Warm Caribbean Editorial (warmth)
   ========================================================================== */

/* ---------- TOKENS ------------------------------------------------------- */
:root{
  /* Ground. Two grounds on purpose: warm manila CHROME identifies the place,
     cool warm-white FIELD carries dense data. The split is functional. */
  --manila:      #EAE1CE;   /* chrome / frame / branch plate                 */
  --manila-deep: #DED2B9;   /* chrome pressed + rules inside chrome          */
  --field:       #FBF9F3;   /* working surface — queue, tables, forms        */
  --field-sunk:  #F3EFE4;   /* inset wells, table headers, disabled          */

  /* Ink. Warm-black, never #000 — this is printed-ledger ink.               */
  --ink:         #191509;
  --ink-2:       #322C1B;   /* body ink on manila                            */
  --slate:       #57503F;   /* secondary text, warm gray-brown               */
  --slate-soft:  #696251;   /* tertiary / captions (>=4.6:1 on BOTH grounds) */
  --hair:        #CFC5AC;   /* hairline rule on chrome                       */
  --hair-field:  #E3DCCB;   /* hairline rule on field                        */

  /* Meaning. Three colours, each with exactly one job. No decorative use.   */
  --green:       #0B4B33;   /* the institution + IN SERVICE + primary action */
  --green-lift:  #106645;
  --green-wash:  #E4EEE7;
  --ochre:       #8B530B;   /* HUMAN JUDGMENT: stepped over, override, provisional */
  --ochre-wash:  #F7EDD9;
  --claret:      #8A2A20;   /* REFUSAL: 409, no-show, degraded               */
  --claret-wash: #F6E4E0;

  /* text/lines drawn IN a meaning colour, split from the fills so a theme
     swap can lift one without wrecking the other */
  --on-green:    #F7F3E8;   /* text sitting on a green fill                  */
  --ochre-text:  #6B4308;   /* ochre used as TEXT                            */
  --ochre-line:  #E3C68C;   /* ochre used as a BORDER                        */
  --ochre-hover: #F2E2C4;
  --oo-text:     #6B4308;   /* out-of-order: reachable, never inviting        */
  --claret-text: #5E1C15;
  --claret-line: #D9A9A2;
  --rail-op:     .24;       /* the spine, against its ground                 */
  --skel-hi:     #EEE9DC;
  --hover:       #F3EFE4;   /* hover always lifts off the ground it sits on  */
  --chrome-hover:#DED2B9;
  --grain-a:     rgba(25,21,9,.018);
  --grain-b:     rgba(25,21,9,.014);
  --scrim:       rgba(25,21,9,.42);
  --spec-bg:     #EDF2F6;
  --spec-ink:    #2B4459;
  --spec-line:   #4E6E8E;
  --spec-dash:   #A8B6C4;
  --spec-code:   #DDE7EF;

  /* Type */
  --display: "Fraunces", "Hoefler Text", Georgia, serif;
  --ui: "Public Sans", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;

  --t-plate:  clamp(1.55rem, 1.1rem + 1.5vw, 2.35rem);
  --t-screen: clamp(1.1rem, 0.95rem + 0.5vw, 1.35rem);
  --t-figure: clamp(1.7rem, 1.2rem + 1.6vw, 2.6rem);
  --t-body:   0.9375rem;
  --t-dense:  0.875rem;
  --t-label:  0.6875rem;

  /* Rhythm — deliberately uneven. Chrome is tight, the line breathes. */
  --gut: 28px;              /* the spine gutter */
  --pad-chrome: 14px;
  --pad-field: 20px;

  --r-sm: 2px;  --r-md: 3px;  /* near-square. This is a ledger, not a card UI */

  --dur: 180ms;
  --ease: cubic-bezier(.2,.7,.3,1);

  --shadow-lift: 0 1px 0 rgba(25,21,9,.06), 0 8px 24px -14px rgba(25,21,9,.45);
  --focus: 0 0 0 2px var(--field), 0 0 0 4px var(--green);
}
/* ==========================================================================
   DARK PALETTE
   Not a generic slate-gray dark mode. The light system is manila and ledger
   ink; the dark one is the same room after hours — tobacco, oiled wood, bone
   paper. Every hue keeps its warm cast, so the two themes read as one product
   at two times of day rather than as two products.
   ========================================================================== */
:root[data-theme="dark"]{
  --manila:      #16120B;   /* chrome: the deepest surface, names the place  */
  --manila-deep: #0F0C06;
  --chrome-hover:#2A2416;
  --field:       #262117;   /* working surface, lifted off the chrome        */
  --field-sunk:  #1C180F;   /* recessed: table heads, wells                  */
  --hover:       #2F2819;

  --ink:         #EFE7D4;   /* bone, never pure white                        */
  --ink-2:       #D6CCB4;
  --slate:       #ABA089;
  --slate-soft:  #948A72;
  --hair:        #3A3222;
  --hair-field:  #3C3524;

  --green:       #4FBC8C;   /* lifted so it reads as text AND as a fill      */
  --green-lift:  #63CE9E;
  --green-wash:  #133220;
  --on-green:    #08170F;   /* dark ink on the green fill, not bone          */

  --ochre:       #D9A24A;
  --ochre-text:  #E8B96F;
  --ochre-line:  #6E5628;
  --ochre-wash:  #2D2312;
  --ochre-hover: #3A2C16;
  --oo-text:     #A98455;

  --claret:      #E0857A;
  --claret-text: #EFA79A;
  --claret-line: #6E3A32;
  --claret-wash: #30201C;

  --rail-op:     .46;
  --skel-hi:     #2E2A1E;
  --grain-a:     rgba(255,246,224,.017);
  --grain-b:     rgba(255,246,224,.013);
  --scrim:       rgba(6,4,0,.68);
  --shadow-lift: 0 1px 0 rgba(0,0,0,.34), 0 16px 38px -18px rgba(0,0,0,.85);

  --spec-bg:     #16212A;
  --spec-ink:    #A9C6DC;
  --spec-line:   #3E6A8C;
  --spec-dash:   #35505F;
  --spec-code:   #21323F;
}
/* the caret cannot take a variable through a data URI, so it is swapped whole */
:root[data-theme="dark"] .select{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1.5 6 6.5 11 1.5' fill='none' stroke='%23ABA089' stroke-width='1.6'/></svg>");
}
/* the degraded band has to out-shout a dark page, not blend into it */
:root[data-theme="dark"] .degraded{ background:#412F11; color:#F8EAC9; border-bottom-color:#6E5527; }
/* and the review bar has to stay clearly not-the-product */
:root[data-theme="dark"] .inspector{ background:#0D0B05; }
:root[data-theme="dark"] .modal{ border-color:var(--hair); }

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background:var(--manila);
  color:var(--ink);
  font-family:var(--ui);
  font-size:var(--t-body);
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric: tabular-nums lining-nums;
  /* paper grain — 2% opacity, the only texture in the system */
  background-image:
    repeating-linear-gradient(0deg, var(--grain-a) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, var(--grain-b) 0 1px, transparent 1px 4px);
}
button,input,select,textarea{ font:inherit; color:inherit; }
button{ background:none; border:0; cursor:pointer; }
:focus-visible{ outline:none; box-shadow:var(--focus); border-radius:var(--r-sm); }
h1,h2,h3,h4,p{ margin:0; }
ul,ol{ margin:0; padding:0; list-style:none; }
table{ border-collapse:collapse; width:100%; }

/* ---------- TYPE ROLES --------------------------------------------------- */
.plate-name{
  font-family:var(--display);
  font-optical-sizing:auto;
  font-variation-settings:"SOFT" 20,"WONK" 1;
  font-size:var(--t-plate); font-weight:600; line-height:1.02;
  letter-spacing:-.014em;
}
.screen-title{
  font-family:var(--display); font-size:var(--t-screen); font-weight:600;
  letter-spacing:-.01em; line-height:1.15;
}
.figure{
  font-family:var(--display); font-size:var(--t-figure); font-weight:600;
  line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums lining-nums;
}
.label{
  font-size:var(--t-label); font-weight:700; text-transform:uppercase;
  letter-spacing:.11em; color:var(--slate);
}
.label-quiet{ font-size:var(--t-label); font-weight:600; text-transform:uppercase;
  letter-spacing:.11em; color:var(--slate-soft); }
.dense{ font-size:var(--t-dense); }
.muted{ color:var(--slate); }
.soft{ color:var(--slate-soft); }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
</style>
<style>
/* ==========================================================================
   CHROME — the branch is the anchor (R3). It is a fixed nameplate, never a
   dropdown. It does not scroll. It is the widest, warmest thing on screen.
   ========================================================================== */
.app{ display:flex; flex-direction:column; min-height:100vh; }

.plate{
  background:var(--manila);
  border-bottom:1px solid var(--hair);
  position:relative; z-index:60;
}
.plate-inner{
  display:flex; align-items:flex-end; gap:24px; flex-wrap:wrap;
  padding:16px var(--pad-field) 0;
  max-width:1680px; margin:0 auto; width:100%;
}
.plate-id{ flex:1 1 340px; min-width:0; }
.plate-eyebrow{
  display:flex; align-items:center; gap:10px; margin-bottom:5px;
}
.mark{
  width:19px; height:19px; flex:none; display:block;
}
.mark .mk-g{ stroke:var(--green); fill:none; }
.mark .mk-gf{ fill:var(--green); }
.mark .mk-o{ stroke:var(--ochre); }
.plate-org{ font-size:var(--t-label); font-weight:700; letter-spacing:.16em;
  text-transform:uppercase; color:var(--green); }
.plate-meta{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  margin-top:7px; font-size:var(--t-dense); color:var(--slate);
}
.plate-meta .dot{ width:3px; height:3px; border-radius:50%; background:var(--hair);
  flex:none; }
.branch-state{
  display:inline-flex; align-items:center; gap:6px; font-weight:600;
  color:var(--green);
}
.branch-state::before{
  content:""; width:7px; height:7px; border-radius:50%; background:var(--green);
  box-shadow:0 0 0 3px var(--green-wash);
}
.branch-state.is-closed{ color:var(--claret); }
.branch-state.is-closed::before{ background:var(--claret); box-shadow:0 0 0 3px var(--claret-wash); }
.clock{ font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }

.plate-side{ display:flex; align-items:center; gap:10px; padding-bottom:2px; }
.whoami{ text-align:right; line-height:1.3; }
.whoami .n{ font-weight:600; font-size:var(--t-dense); }
.avatar{
  width:34px; height:34px; border-radius:50%; flex:none;
  background:var(--green); color:var(--on-green); display:grid; place-items:center;
  font-size:12px; font-weight:700; letter-spacing:.04em;
}

/* Role tabs — they sit ON the plate, tabbed like a ledger index. */
.roles{ display:flex; gap:2px; padding:12px var(--pad-field) 0;
  max-width:1680px; margin:0 auto; width:100%; overflow-x:auto;
  scrollbar-width:none; }
.roles::-webkit-scrollbar{ display:none; }
.role-tab{
  position:relative; display:flex; flex-direction:column; gap:1px;
  padding:8px 16px 9px; border:1px solid transparent; border-bottom:0;
  border-radius:var(--r-md) var(--r-md) 0 0; color:var(--slate);
  white-space:nowrap; transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
  min-height:44px;
}
.role-tab .rt-name{ font-size:var(--t-dense); font-weight:600; letter-spacing:.005em; }
.role-tab .rt-sub{ font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  font-weight:600; color:var(--slate-soft); }
.role-tab:hover{ background:var(--chrome-hover); color:var(--ink); }
.role-tab[aria-selected="true"]{
  background:var(--field); border-color:var(--hair); color:var(--ink);
  box-shadow:0 -1px 0 var(--green) inset, 0 3px 0 var(--green);
}
.role-tab[aria-selected="true"]::after{
  content:""; position:absolute; left:0; right:0; top:0; height:3px;
  background:var(--green); border-radius:var(--r-md) var(--r-md) 0 0;
}
.role-tab[aria-selected="true"] .rt-sub{ color:var(--green); }
.role-tab[disabled]{ opacity:.4; cursor:not-allowed; }

/* Sub-navigation within a role */
.subnav{
  background:var(--field); border-bottom:1px solid var(--hair-field);
  position:sticky; top:0; z-index:50;
  transition:box-shadow var(--dur) var(--ease);
}
body.scrolled .subnav{ box-shadow:0 6px 18px -14px rgba(25,21,9,.55); }
.subnav-wrap{
  display:flex; align-items:stretch; padding:0 var(--pad-field);
  max-width:1680px; margin:0 auto; width:100%;
}
/* the branch never leaves the screen: when the plate scrolls off, its name
   takes a seat in the section bar. It is a label, not a control. */
.branch-chip{
  display:none; align-items:center; gap:9px; flex:none; white-space:nowrap;
  padding-right:15px; margin-right:13px; border-right:1px solid var(--hair-field);
  font-size:var(--t-dense); font-weight:700;
}
.branch-chip .bc-dot{ width:7px; height:7px; border-radius:50%;
  background:var(--green); box-shadow:0 0 0 3px var(--green-wash); flex:none; }
.branch-chip.is-closed .bc-dot{ background:var(--claret); box-shadow:0 0 0 3px var(--claret-wash); }
body.scrolled .branch-chip{ display:flex; }
.subnav-inner{
  display:flex; gap:2px; min-width:0; flex:1;
  overflow-x:auto; scrollbar-width:none;
}
.subnav-inner::-webkit-scrollbar{ display:none; }
.sub-tab{
  padding:11px 14px; font-size:var(--t-dense); font-weight:500; color:var(--slate);
  border-bottom:2px solid transparent; white-space:nowrap; min-height:44px;
  transition:color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.sub-tab:hover{ color:var(--ink); }
.sub-tab[aria-selected="true"]{ color:var(--ink); border-bottom-color:var(--ink);
  font-weight:600; }
.sub-tab .badge{
  display:inline-block; margin-left:7px; padding:1px 6px; border-radius:9px;
  background:var(--ochre); color:#FFF9EE; font-size:10px; font-weight:700;
  vertical-align:1px;
}

/* ==========================================================================
   COUNTER STRIP — counters are first-class (R5). Always visible, always
   showing who each one is serving. Labels are DATA.
   ========================================================================== */
.counters{
  background:var(--manila); border-bottom:1px solid var(--hair);
  padding:12px var(--pad-field) 13px;
}
.counters-inner{ max-width:1680px; margin:0 auto; }
.counters-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:9px; }
.counter-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr));
  gap:9px; }
.counter{
  background:var(--field); border:1px solid var(--hair);
  border-left:3px solid var(--hair); border-radius:var(--r-md);
  padding:11px 13px; display:flex; flex-direction:column; gap:2px;
  min-height:88px; position:relative; overflow:hidden;
  transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.counter-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.counter-label{ font-size:var(--t-dense); font-weight:700; letter-spacing:.02em; }
.counter-state{ font-size:10px; font-weight:700; text-transform:uppercase;
  letter-spacing:.1em; color:var(--slate-soft); }
.counter-serving{ font-family:var(--display); font-size:1.05rem; font-weight:600;
  line-height:1.2; margin-top:3px; }
.counter-sub{ font-size:var(--t-dense); color:var(--slate); }
.counter.is-serving{ border-left-color:var(--green); background:var(--field); }
.counter.is-serving .counter-state{ color:var(--green); }
.counter.is-called{ border-left-color:var(--ochre); }
.counter.is-called .counter-state{ color:var(--ochre); }
.counter.is-open{ border-left-color:var(--hair); }
.counter.is-closed{ background:var(--field-sunk); border-left-color:var(--hair);
  opacity:.72; }
.counter .cta{ margin-top:auto; padding-top:8px; }
</style>
<style>
/* ==========================================================================
   LAYOUT
   ========================================================================== */
.work{ flex:1; background:var(--field); }
.work-inner{
  max-width:1680px; margin:0 auto; width:100%;
  display:grid; grid-template-columns:minmax(0,1fr) 344px;
  align-items:start;
}
body.no-rail .work-inner{ grid-template-columns:minmax(0,1fr); }
.main-col{ min-width:0; padding:var(--pad-field) var(--pad-field) 72px; }
.rail-col{
  border-left:1px solid var(--hair-field); background:var(--field);
  padding:var(--pad-field) var(--pad-field) 72px;
  position:sticky; top:44px; align-self:start; max-height:calc(100vh - 44px);
  overflow-y:auto;
}
.section-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:14px;
  flex-wrap:wrap; padding-bottom:11px; margin-bottom:14px;
  border-bottom:1px solid var(--hair-field);
}
.section-head .sh-l{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
.section-note{ font-size:var(--t-dense); color:var(--slate); max-width:58ch; }
.stack{ display:flex; flex-direction:column; gap:18px; }

/* ==========================================================================
   THE LINE — the signature element.
   One continuous spine runs the length of the queue. Every entry is a node on
   it, in join order (I1). When call-next passes someone, the SPINE ITSELF
   swerves around them and the node is left detached (I8). Being stepped over
   is drawn as a deviation in the line of service, not as a badge that staff
   learn to stop seeing.
   ========================================================================== */
.line{ position:relative; }
.entry{
  position:relative; display:grid;
  grid-template-columns:var(--gut) 88px minmax(0,1fr) auto;
  gap:0 16px; align-items:start;
  padding:13px 12px 13px 0; border-bottom:1px solid var(--hair-field);
  transition:background var(--dur) var(--ease);
}
.entry:hover{ background:var(--hover); }
/* the review bar is fixed; keep scrolled-to rows clear of it */
.entry,.counter,.panel{ scroll-margin-bottom:80px; scroll-margin-top:60px; }
.entry:first-child .rail-seg{ top:28px; }
.entry:last-child .rail-seg{ bottom:calc(100% - 28px); }

.rail{ position:relative; grid-column:1; align-self:stretch; min-height:50px; }
.rail-seg{
  position:absolute; left:13px; top:-14px; bottom:-14px; width:2px;
  background:var(--ink); opacity:var(--rail-op);
}
.node{
  position:absolute; left:9px; top:23px; width:10px; height:10px;
  border-radius:50%; background:var(--field); border:2px solid var(--ink);
  opacity:.5; z-index:2;
  transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease),
             transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
}
.entry.st-called .node,
.entry.st-serving .node{ background:var(--green); border-color:var(--green);
  opacity:1; transform:scale(1.3); }
.entry.st-provisional .node{ border-style:dashed; border-color:var(--ochre); opacity:.95; }
.entry.st-served .node,
.entry.st-noshow .node,
.entry.st-left .node{ opacity:.26; transform:scale(.7); }

.detour{ position:absolute; left:0; top:-14px; width:var(--gut);
  height:calc(100% + 28px); }
.entry.is-stepped .rail{ grid-row:1 / span 2; }
.detour path{ fill:none; stroke:var(--ochre); stroke-width:2; opacity:.9; }
.entry.is-stepped .rail-seg{ display:none; }
.entry.is-stepped .node{ border-color:var(--ochre); background:var(--field);
  opacity:1; box-shadow:0 0 0 3px var(--ochre-wash); }
@media (prefers-reduced-motion:no-preference){
  .detour path{ stroke-dasharray:260; stroke-dashoffset:260;
    animation:drawDetour 560ms var(--ease) forwards; }
}
@keyframes drawDetour{ to{ stroke-dashoffset:0; } }

.ticket{ grid-column:2; padding-top:1px; }
.ticket-no{ font-size:1.02rem; font-weight:700; letter-spacing:.02em; line-height:1.12; }
.ticket-time{ font-size:var(--t-label); color:var(--slate-soft); font-weight:600;
  letter-spacing:.05em; margin-top:2px; }

.who{ grid-column:3; min-width:0; }
.who-name{ font-family:var(--display); font-size:1.05rem; font-weight:600;
  line-height:1.25; letter-spacing:-.005em; }
.who-name .unnamed{ font-family:var(--ui); font-size:.875rem; font-style:italic;
  color:var(--slate-soft); font-weight:400; letter-spacing:0; }
.who-line{ display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  margin-top:4px; font-size:var(--t-dense); color:var(--slate); }
.who-line .sep{ width:3px; height:3px; border-radius:50%; background:var(--hair); flex:none; }
.chan{ display:inline-flex; align-items:center; gap:5px; font-weight:500; }
.chan svg{ width:13px; height:13px; flex:none; opacity:.7; }

.pill{
  display:inline-flex; align-items:center; gap:6px; padding:2px 8px;
  border-radius:2px; font-size:10px; font-weight:700; text-transform:uppercase;
  letter-spacing:.09em; border:1px solid; line-height:1.5;
}
.pill-waiting{ color:var(--slate); border-color:var(--hair); background:var(--field-sunk); }
.pill-provisional{ color:var(--ochre); border-color:var(--ochre-line); background:var(--ochre-wash); }

<script>
"use strict";
/* ==========================================================================
   HOLD MY SPOT — STAFF CONSOLE (design render)
   The data layer below imitates the shapes in section 5 of the commission:
   every read returns {ok:true, value} and every refusal returns
   {ok:false, reason}. Nothing here talks to the network. In the build this
   file is replaced by fetch() against the API base read from env.js.
   ========================================================================== */

/* ---------- live snapshot store -------------------------------------------
   THE ONE ACCESSOR RULE (spec section 6): every read below goes through DB,
   and DB is written by exactly one function, refreshSnapshot(). Two bugs in
   the design render came from components reading around the accessor; the
   build keeps the rule by having nothing else to read.
   -------------------------------------------------------------------------- */
let SERVICE_TYPES = [];          /* [{id, code, label}] — from GET /api/service-types */
let PROVISIONAL_NOTE = "";       /* rendered from the payload, never typed here (R-I) */

/* Pre-Clerk presentation only. Role tabs switch freely until P2 enforcement
   turns on (spec section 9); every refusal already happens on the API. */
const STAFF = [
  { id:"df", name:"Denise Foster",  role:"clerk",   initials:"DF", title:"Desk Clerk" },
  { id:"as", name:"Andrea Simpson", role:"manager", initials:"AS", title:"Branch Manager" },
  { id:"eb", name:"Errol Bailey",   role:"admin",   initials:"EB", title:"Administrator" }
];

function emptyDb(){
  return {
    locations: [], counters: {}, entries: [], log: [], totals: {},
    approvals: [],            /* no request-queue backend exists; empty state renders (gap, flagged) */
    estimate: null,           /* {refused, rendered, basis} — the API's words, verbatim */
    dashboard: null, adherence: null, overview: null, drill: null
  };
}
let DB = emptyDb();

/* Stepped-over is session state fed by call-next responses. The DURABLE record
   is the fairness log; this map only keeps the note on the row until the entry
   is confirmed or removed. A reload loses the note, never the record. */
const STEPPED = {};
</script>
<script>
"use strict";
/* ---------- console state ------------------------------------------------ */
const S = {
  role: "clerk",
  screen: "board",
  loc: null,             // resolved from GET /api/locations at boot
  myCounter: null,       // resolved from GET /api/counters at boot
  mode: "loading",       // live | loading | degraded — empty falls out of DATA, never a mode
  showSpec: false,
  refusal: null,         // {title, detail, code}
  phoneEntryId: null,    // the simulated handset follows the most recent remote entry
  phoneInbox: [],
  phoneSurveyOpen: false,
  lastGood: "--:--",
  clock: "--:--",
  drillLoc: null
};
const SCREENS = {
  clerk:   [ {id:"board", label:"The line"}, {id:"reception", label:"Reception join"}, {id:"served", label:"Served today"}, {id:"phone", label:"Customer phone"} ],
  manager: [ {id:"board", label:"The line"}, {id:"dashboard", label:"Dashboard"}, {id:"adherence", label:"Adherence"},
             {id:"approvals", label:"Out-of-order requests", badge:true}, {id:"closeofday", label:"Close of day"},
             {id:"setup", label:"Counters and services"} ],
  admin:   [ {id:"network", label:"All branches"}, {id:"branch", label:"Branch detail"}, {id:"compare", label:"Comparison"} ]
};

/* ---------- helpers ------------------------------------------------------ */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const svcLabel = code => (SERVICE_TYPES.find(x=>x.code===code)||{}).label || code;
const loc = id => DB.locations.find(l=>l.id===(id||S.loc));
const counters = id => DB.counters[id||S.loc] || [];
/* The REAL person once signed in; the presentation roster only before
   Clerk is enabled. Post-enforcement, actor and approver identity come from
   the SESSION on the server anyway -- this name is display, not authority. */
const me = () => SESSION_USER && SESSION_USER.role
  ? { name: SESSION_USER.name, initials: SESSION_USER.initials, title: { desk:"Desk Clerk", manager:"Branch Manager", admin:"Administrator" }[SESSION_USER.role] }
  : (STAFF.find(s=>s.role===S.role) || STAFF[0]);
const ACTIVE = ["provisional","waiting","called","serving"];

const ICON = {
  whatsapp:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.4 13.6 3.3 10.6A5.6 5.6 0 1 1 5.5 12.8z" stroke-linejoin="round"/><path d="M6 6.2c.3 1.6 2.2 3.5 3.8 3.8l.8-.9 1.2.6-.3 1.1c-1.9.5-4.9-2.5-4.4-4.4l1.1-.3.6 1.2z" fill="currentColor" stroke="none"/></svg>',
  qr:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="4.6" height="4.6"/><rect x="9.4" y="2" width="4.6" height="4.6"/><rect x="2" y="9.4" width="4.6" height="4.6"/><path d="M9.4 9.4h2v2h-2zM12.4 12.4h1.6v1.6h-1.6z"/></svg>',
  reception:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="5.2" r="2.6"/><path d="M2.8 14c0-2.9 2.3-4.6 5.2-4.6s5.2 1.7 5.2 4.6"/></svg>',
  warn:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 2.6 18.4 17H1.6z" stroke-linejoin="round"/><path d="M10 7.6v4.2M10 14.4v.1" stroke-linecap="round"/></svg>',
  info:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.4"/><path d="M8 7.4v4M8 4.9v.1" stroke-linecap="round"/></svg>',
  offline:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 2 18 18"/><path d="M4.2 8.2a9 9 0 0 1 3.1-1.9M12.9 7.1A9 9 0 0 1 15.8 8.2"/><path d="M7 11.3a5 5 0 0 1 1.4-.8M11.7 10.6a5 5 0 0 1 1.3.7"/><path d="M10 15v.1"/></svg>',
  x:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  line:'<svg viewBox="0 0 40 40" width="40" height="40" fill="none" stroke="#191509" stroke-width="1.6"><path d="M20 6v28"/><circle cx="20" cy="11" r="3.2"/><circle cx="20" cy="21" r="3.2"/><circle cx="20" cy="31" r="3.2"/></svg>'
};
const chanIcon = ch => ICON[ch] || ICON.reception;
const chanLabel = ch => ch==="whatsapp" ? "WhatsApp" : ch==="qr" ? "QR code" : "Reception";

function spec(html){ return '<div class="spec">'+html+'</div>'; }

/* ==========================================================================
   API BINDING — the render's mock carried this banner: "The shape is the
   contract. The build swaps the body, not the signature." This is the swap.
   Reads stay synchronous against the snapshot; writes go to the network and
   then refresh the snapshot, so there is still exactly one way data enters.
   ========================================================================== */
const API_BASE = (window.HMS_API_BASE || "").replace(/\/+$/, "");

/* ==========================================================================
   P2 AUTH, frontend half. ACTIVE ONLY WHEN env.js CARRIES THE PUBLISHABLE
   KEY; without it the console runs exactly as it did before Clerk existed.
   The key is public by design (pk_test_/pk_live_); the SECRET key never
   appears on this surface and the build's secret-split assertion fails the
   deploy if it ever does.

   The frontend HIDES AND ROUTES; it never decides. Every refusal happens on
   the API, from the token's signature. A desk session that somehow reached
   the admin tab would meet a 403 on the first read.
   ========================================================================== */
const CLERK_PK = window.HMS_CLERK_PK || "";
let SESSION_USER = null;   /* {name, role, initials} once signed in */

function clerkEnabled(){ return CLERK_PK !== ""; }

function fapiDomain(){
  /* The publishable key encodes the frontend API domain, base64 with a
     trailing $: this derivation is Clerk's own documented scheme. */
  try { return atob(CLERK_PK.replace(/^pk_(test|live)_/, "")).replace(/\$$/, ""); }
  catch (e) { return ""; }
}

function loadClerk(){
  return new Promise(function(resolve, reject){
    const el = document.createElement("script");
    el.src = "https://" + fapiDomain() + "/npm/@clerk/clerk-js@5/dist/clerk.browser.js";
    el.setAttribute("data-clerk-publishable-key", CLERK_PK);
    el.onload = function(){ window.Clerk.load().then(resolve, reject); };
    el.onerror = reject;
    document.head.appendChild(el);
  });
}

async function authToken(){
  if (!clerkEnabled() || !window.Clerk || !window.Clerk.session) return null;
  /* The hms template carries role from public_metadata. clerk-js caches and
     refreshes these; one network hop a minute, not one per call. */
  return window.Clerk.session.getToken({ template: "hms" });
}

function sessionFromClerk(){
  const u = window.Clerk.user;
  if (!u) return null;
  const role = (u.publicMetadata || {}).role;
  if (role !== "desk" && role !== "manager" && role !== "admin") return { name: u.fullName || u.username || "Signed in", role: null };
  const name = u.fullName || u.username || role;
  return {
    name: name,
    role: role,
    initials: name.split(/\s+/).map(function(w){ return w[0]; }).join("").slice(0,2).toUpperCase()
  };
}

function showSignInGate(message){
  document.body.innerHTML =
    '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--manila);color:var(--ink);font-family:var(--ui)">' +
      '<div style="font-family:var(--display);font-size:1.6rem">Hold My Spot</div>' +
      (message ? '<div style="max-width:420px;text-align:center;color:var(--slate)">' + esc(message) + '</div>' : '') +
      '<div id="signInMount"></div>' +
    '</div>';
  window.Clerk.mountSignIn(document.getElementById("signInMount"));
}

async function apiGET(path){
  const headers = { "accept": "application/json" };
  const token = await authToken();
  if (token) headers["Authorization"] = "Bearer " + token;
  const r = await fetch(API_BASE + path, { headers: headers });
  return r.json();
}
async function apiPOST(path, body){
  const headers = { "content-type": "application/json" };
  const token = await authToken();
  if (token) headers["Authorization"] = "Bearer " + token;
  const r = await fetch(API_BASE + path, {
    method: "POST",
    headers: headers,
    body: JSON.stringify(body || {})
  });
  return r.json();
}

/* API {ok:false, reason:string} -> the refusal strip's {title, detail, code}.
   The reason is the first sentence; the second is the standing instruction.
   Never the word "Error", never a raw object. */
function toRefusal(res){
  const reason = (res && res.reason) ? String(res.reason) : "The branch could not record that";
  return { code: 409, title: reason.charAt(0).toUpperCase() + reason.slice(1),
           detail: "The line is showing you the current state. If this keeps happening, refresh and try once more." };
}

function jamaicaClock(d){
  return new Intl.DateTimeFormat("en-JM", { hour:"2-digit", minute:"2-digit", hour12:false, timeZone:"America/Jamaica" }).format(d || new Date());
}

/* ---- snapshot reads over DB (sync, unchanged signatures) ----------------- */
function entriesFor(locId){
  return DB.entries.filter(e => e.loc === (locId||S.loc));
}
function queueFor(locId){
  return entriesFor(locId).filter(e => ACTIVE.includes(e.status));
}
function getBoard(locId){
  if (S.mode === "loading") return { ok:true, value:null, loading:true };
  return { ok:true, value:{
    queue: queueFor(locId),
    totals: DB.totals[locId||S.loc] || {joined:0,served:0,noshow:0,left:0},
    events: DB.log,
    estimate: getEstimate(locId)
  }};
}
/* R-G holds by CONSTRUCTION: this returns the API's words and never computes.
   There is no code path here that could produce a single number. */
function getEstimate(){
  if (S.mode === "degraded")
    return { refused:true,
      rendered:"We cannot estimate your wait yet, so we would rather not guess.",
      basis:"The estimator has not been reachable since " + S.lastGood + ". It will not fall back to yesterday and call it today." };
  if (!DB.estimate)
    return { refused:true,
      rendered:"We cannot estimate your wait yet, so we would rather not guess.",
      basis:"The console has not completed a read yet." };
  return DB.estimate;
}
function refuse(title, detail){ return { ok:false, reason:{ code:409, title:title, detail:detail } }; }
function guardWrite(){
  if (S.mode === "degraded")
    return refuse("The branch cannot record that right now",
      "The console has not reached the API since " + S.lastGood + ". Nothing has been written and nothing has been lost. The line below is the last state we know to be true.");
  return null;
}

/* ---- shape mapping ------------------------------------------------------- */
function svcCodeById(id){ const t = SERVICE_TYPES.find(x=>x.id===id); return t ? t.code : null; }
function mapEntry(row, locId){
  return {
    id: row.id,
    /* No ticket number exists in the schema (finding, ledgered). The short id
       stands in until King B rules a real one. */
    t: "\u00b7" + String(row.id).slice(0,4).toUpperCase(),
    loc: locId,
    name: row.name || null,
    ch: row.channel,
    st: svcCodeById(row.service_type_id),
    status: row.status,
    at: jamaicaClock(new Date(row.joined_at)),
    joinedAt: row.joined_at,
    counter: row.counter || null,      /* counter LABEL; client counter ids ARE labels */
    contact: row.contact || null,
    survey: row.survey !== undefined ? row.survey : null,
    steppedOver: !!STEPPED[row.id],
    steppedOverReason: STEPPED[row.id] || null
  };
}
function mapEventLine(ev, byId){
  const e = ev.entry_id ? byId[ev.entry_id] : null;
  const who = e ? (e.name || ("entry " + (e.t||""))) : "an entry";
  const kindWords = {
    onsite_join:"joined at the branch", remote_join:"joined by WhatsApp. Awaiting confirmation",
    qr_join:"joined by QR code", call_next:"was called in turn",
    out_of_order_call:"was called ahead of the line", check_in:"arrived at the counter",
    complete_service:"was served", no_show:"was marked a no-show",
    undo_call:"had the call undone", undo_check_in:"had the check-in undone",
    customer_leaves:"left the line", operator_removes:"was removed from the line",
    confirm:"confirmed their place", close_of_day:"close of day released the line"
  };
  const words = kindWords[ev.kind] || (ev.kind + " " + (ev.from_status||"") + " \u2192 " + (ev.to_status||""));
  let text = "<b>" + esc(who) + "</b> " + words + ".";
  if (ev.kind === "out_of_order_call")
    text += " Reason given: " + esc(ev.reason || "none recorded") + ". Approved by <b>" + esc(ev.approver || "UNRECORDED") + "</b>.";
  if (ev.actor) text += ' <span class="who-tag">' + esc(ev.actor) + "</span>";
  const kind = ev.kind === "out_of_order_call" ? "over" : ev.kind === "call_next" ? "call" : ev.kind === "no_show" ? "noshow" : "join";
  return { t: jamaicaClock(new Date(ev.occurred_at)), kind: kind, text: text };
}

/* ---- THE ONE WRITER OF DB ------------------------------------------------ */
let everLoaded = false;
async function refreshSnapshot(){
  try {
    if (!DB.locations.length){
      const locs = await apiGET("/api/locations");
      DB.locations = (locs.value||[]).map(l => ({ id:l.id, name:l.name, tz:l.timezone, status:"open" }));
      if (!S.loc && DB.locations.length) S.loc = DB.locations[0].id;
    }
    if (!S.loc) throw new Error("no location");
    /* Board, counters and service types are LOAD-BEARING: without them there
       is no console and failing to degraded is honest. Served-today is not --
       a served list that cannot load must cost the served screen its rows,
       never the line its existence. Found live: the first deploy of this file
       raced the backend that serves /api/served-today, and the whole console
       sat in loading because a subordinate read was treated as critical. */
    const [ctr, svc, board] = await Promise.all([
      apiGET("/api/counters?locationId=" + S.loc),
      apiGET("/api/service-types?locationId=" + S.loc),
      apiGET("/api/board?locationId=" + S.loc)
    ]);
    const served = await apiGET("/api/served-today?locationId=" + S.loc)
      .catch(function(){ return { ok:false, value: [] }; });
    SERVICE_TYPES = (svc.value||[]).map(t => ({ id:t.id, code:t.code, label:t.label }));
    PROVISIONAL_NOTE = svc.provisionalNote || PROVISIONAL_NOTE;
    DB.counters[S.loc] = (ctr.value||[]).map(c => ({ id:c.label, label:c.label, open:c.active }));
    if (!S.myCounter && DB.counters[S.loc].length) S.myCounter = DB.counters[S.loc][0].id;

    const q = (board.value.queue||[]).map(r => mapEntry(r, S.loc));
    const done = (served.value||[]).map(r => mapEntry(Object.assign({}, r, {
      status: "served",
      survey: !r.survey_sent ? null : {
        achieved: r.survey_responded ? r.achieved : null,
        waitMatch: !r.survey_responded ? null : (r.wait_match !== null ? true : null),
        sent: true
      }
    }), S.loc));
    DB.entries = q.concat(done);

    const t = board.value.totals || { served:0, noshow:0, left:0 };
    DB.totals[S.loc] = { joined: q.length + done.length + t.noshow + t.left, served: t.served, noshow: t.noshow, left: t.left };

    const byId = {}; DB.entries.forEach(e => { byId[e.id] = e; });
    DB.log = (board.value.events||[]).map(ev => mapEventLine(ev, byId));

    const est = board.value.estimate;
    DB.estimate = { refused: est.kind !== "estimate", rendered: est.text, basis: est.basis };

    S.mode = "live"; S.lastGood = jamaicaClock(); everLoaded = true;
    const conn = $("#connState");
    if (conn) conn.textContent = "Live \u00b7 " + API_BASE.replace(/^https?:\/\//, "");
  } catch (err) {
    /* Fail loudly toward the operator, never silently: the degraded band takes
       the whole top of the page and every write control disables. */
    if (everLoaded) S.mode = "degraded"; else S.mode = "loading";
    const conn = $("#connState");
    if (conn) conn.textContent = everLoaded ? ("LOST THE API \u00b7 last confirmed " + S.lastGood) : "Connecting to the branch\u2026";
  }
}

/* Screen-scoped reads, fetched when their screen is active. Same accessor
   rule: they write DB, render reads DB. */
async function ensureScreenData(){
  try {
    if (S.screen === "dashboard" || S.screen === "adherence"){
      const which = S.screen;
      const res = await apiGET("/api/" + which + "?locationId=" + S.loc + "&windowDays=7");
      DB[which] = res.value || null;
    }
    if (S.screen === "phone"){
      /* The handset follows the most recent WhatsApp entry: active first, else
         one that was served and still has its survey open. */
      const remote = entriesFor().filter(function(e){ return e.ch === "whatsapp"; });
      const active = remote.filter(function(e){ return ACTIVE.includes(e.status); });
      const track = active.length ? active[active.length-1]
                  : remote.length ? remote[remote.length-1] : null;
      S.phoneEntryId = track ? track.id : null;
      if (S.phoneEntryId){
        const [inbox, sv] = await Promise.all([
          apiGET("/api/inbox?entryId=" + S.phoneEntryId),
          apiGET("/api/survey-status?entryId=" + S.phoneEntryId)
        ]);
        S.phoneInbox = inbox.value || [];
        S.phoneSurveyOpen = !!(sv.value && sv.value.open);
      } else { S.phoneInbox = []; S.phoneSurveyOpen = false; }
    }
    if (S.role === "admin"){
      const ov = await apiGET("/api/admin/overview");
      DB.overview = ov.value || [];
      if (S.screen === "branch" && S.drillLoc){
        const b = await apiGET("/api/board?locationId=" + S.drillLoc);
        DB.drill = { queue: (b.value.queue||[]).map(r => mapEntry(r, S.drillLoc)) };
      }
    }
  } catch (err) { /* the main poll owns degraded mode; screen data just stays null */ }
}

/* ---- writes: to the network, then the snapshot, then the paint ----------- */
async function callNext(counterId){
  const g = guardWrite(); if (g) return g;
  const res = await apiPOST("/api/call-next", { locationId: S.loc, counter: counterId, actor: me().name });
  if (!res.ok) return { ok:false, reason: toRefusal(res) };
  const v = res.value || {};
  (v.steppedOver||[]).forEach(function(x){
    STEPPED[x.id] = "Passed for " + counterId + " at " + jamaicaClock() +
      ". This entry has not been confirmed, so call-next moved to the next confirmed person in line.";
  });
  await refreshSnapshot();
  return { ok:true, value:{ called: DB.entries.find(e=>e.id===v.calledEntryId) || null, steppedOver: v.steppedOver||[] } };
}
async function entryVerb(id, verb){
  const g = guardWrite(); if (g) return g;
  const res = await apiPOST("/api/" + verb, { entryId: id, locationId: S.loc, actor: me().name });
  if (!res.ok) return { ok:false, reason: toRefusal(res) };
  if (verb === "confirm" || verb === "remove" || verb === "leave") delete STEPPED[id];
  await refreshSnapshot();
  return { ok:true, value: res.value };
}
/* I7 upgrade path: pre-Clerk the approver travels as the recorded string
   (R13, recorded not authenticated); once enforcement is on, the API writes
   the SESSION identity and ignores this field. No client change at cutover. */
async function callOutOfOrder(id, approver, reason){
  const g = guardWrite(); if (g) return g;
  const res = await apiPOST("/api/call-entry", {
    locationId: S.loc, entryId: id, counter: S.myCounter, approver: approver, reason: reason
  });
  if (!res.ok) return { ok:false, reason: toRefusal(res) };
  await refreshSnapshot();
  return { ok:true, value: res.value };
}
function nameOf(e){ return e.name || ("Ticket "+e.t); }
function statusWord(s){
  return { provisional:"not yet confirmed", waiting:"waiting in line", called:"called and not yet at the counter",
           serving:"being served", served:"already served", noshow:"marked a no-show", left:"out of the line" }[s] || s;
}
function pastTense(v){
  return { confirm:"was confirmed", "check-in":"was checked in", complete:"was completed",
           "no-show":"was marked a no-show", "undo-call":"had the call undone",
           "undo-check-in":"had the check-in undone", leave:"left the line", remove:"was removed from the line" }[v] || v;
}
</script>
<script>
"use strict";
/* ==========================================================================
   RENDER — CHROME
   ========================================================================== */
function renderChrome(){
  const L = loc();
  const u = me();
  $("#userName").textContent = u.name;
  $("#userRole").textContent = S.role==="admin" ? "Administrator" : u.title;
  $("#userInitials").textContent = u.initials;

  if (S.role === "admin" && S.screen === "network"){
    $("#orgLine").textContent = "Hold My Spot";
    $("#plateName").textContent = "All branches";
    $("#plateMeta").innerHTML =
      '<span class="branch-state">' + DB.locations.length + (DB.locations.length===1?' branch':' branches') + '</span>' +
      '<span class="dot"></span><span>Jamaica</span>' +
      '<span class="dot"></span><span class="clock">' + S.clock + '</span>' +
      '<span class="dot"></span><span>America/Jamaica</span>';
  } else {
    /* The plate renders ONLY fields the API carries: name, timezone, clock.
       Branch hours are not a concept the backend has yet; the plate does not
       invent an "Open until". */
    const shown = ((S.role==="admin" && S.screen==="branch") ? loc(S.drillLoc) : L) || { name:"\u2026", tz:"" };
    $("#orgLine").innerHTML   = S.role==="admin" && S.screen==="branch"
      ? 'Hold My Spot <span style="color:var(--slate-soft)">&middot; viewing one branch</span>' : "Hold My Spot";
    $("#plateName").textContent = shown.name;
    $("#plateMeta").innerHTML =
      '<span class="branch-state">Serving today</span>' +
      '<span class="dot"></span><span class="clock">' + S.clock + '</span>' +
      (shown.tz ? '<span class="dot"></span><span>' + esc(shown.tz) + '</span>' : '');
  }

  const chipLoc = (S.role==="admin" && S.screen!=="branch") ? null
                : (S.role==="admin" && S.screen==="branch") ? loc(S.drillLoc) : L;
  $("#branchChip").className = "branch-chip";
  $("#branchChip").innerHTML = chipLoc
    ? '<span class="bc-dot"></span>' + esc(chipLoc.name)
    : '<span class="bc-dot"></span>All branches';

  $$(".role-tab").forEach(b => {
    b.setAttribute("aria-selected", String(b.dataset.role === S.role));
    /* With a session, tabs above the holder's rank are disabled AS A COURTESY;
       the API refuses them regardless. Hiding a button is not access control,
       and neither is disabling one. */
    if (SESSION_USER && SESSION_USER.role){
      /* Both vocabularies rank identically: tab ids say clerk, sessions say
         desk. The same mismatch that killed desk sign-ins also wrongly
         disabled the clerk tab for managers. One map carries both words. */
      const rank = { clerk:1, desk:1, manager:2, admin:3 };
      const can = rank[b.dataset.role] <= rank[SESSION_USER.role];
      b.toggleAttribute("disabled", !can);
    }
  });

  const pending = DB.approvals.length;
  $("#subnav").innerHTML = SCREENS[S.role].map(s =>
    '<button class="sub-tab" role="tab" data-screen="' + s.id + '" aria-selected="' + (s.id===S.screen) + '">' +
      esc(s.label) + (s.badge && pending ? '<span class="badge">' + pending + '</span>' : '') +
    '</button>').join("");

  const slot = $("#degradedSlot");
  slot.innerHTML = S.mode === "degraded"
    ? '<div class="degraded">' + ICON.offline +
      '<div><b>The console has lost the API.</b> Nothing you do here will be recorded until it is back. What you see below is the last state we know to be true, from ' + S.lastGood + '.</div>' +
      '<span class="age">Last confirmed ' + S.lastGood + '</span></div>'
    : "";
}

/* ==========================================================================
   RENDER — COUNTER STRIP (R5)
   ========================================================================== */
function renderCounters(){
  const strip = $("#counterStrip");
  if (S.role === "admin" && S.screen !== "branch"){ strip.style.display = "none"; return; }
  strip.style.display = "";
  const locId = (S.role==="admin" && S.screen==="branch") ? S.drillLoc : S.loc;
  const cs = counters(locId);
  const q  = S.mode === "empty" ? [] : DB.entries.filter(e => e.loc === locId);
  const readOnly = S.mode === "degraded" || S.role === "admin";

  if (S.mode === "loading"){
    strip.innerHTML = '<div class="counters-inner"><div class="counters-head"><span class="label">Counters</span></div>' +
      '<div class="counter-grid">' + cs.map(()=>'<div class="counter"><div class="skel" style="width:64%"></div>' +
      '<div class="skel" style="width:44%;margin-top:12px;height:16px"></div>' +
      '<div class="skel" style="width:80%;margin-top:9px"></div></div>').join("") + '</div></div>';
    return;
  }

  const tiles = cs.map(c => {
    const at = q.find(e => e.counter === c.id && (e.status==="called" || e.status==="serving"));
    let cls = "is-open", state = "Open", body, sub = "";
    if (!c.open){ cls = "is-closed"; state = "Closed"; body = '<div class="counter-sub soft">Not taking anyone today.</div>'; }
    else if (at && at.status === "serving"){
      cls = "is-serving"; state = "Serving";
      body = '<div class="counter-serving">' + esc(nameOf(at)) + '</div>';
      sub  = '<div class="counter-sub">' + at.t + ' &middot; ' + esc(svcLabel(at.st)) + '</div>';
    } else if (at && at.status === "called"){
      cls = "is-called"; state = "Called, not arrived";
      body = '<div class="counter-serving">' + esc(nameOf(at)) + '</div>';
      sub  = '<div class="counter-sub">' + at.t + ' &middot; called ' + S.clock + '</div>';
    } else {
      body = '<div class="counter-sub soft" style="margin-top:4px">No one at this counter.</div>';
      sub  = readOnly ? '' :
        '<div class="cta"><button class="btn btn-primary btn-sm" data-act="call-next" data-counter="' + c.id + '">Call next</button></div>';
    }
    const mine = (S.role === "clerk" && c.id === S.myCounter)
      ? '<span class="counter-state"><span style="color:var(--green)">Your counter</span> &middot; ' + state + '</span>'
      : '<span class="counter-state">' + state + '</span>';
    return '<div class="counter ' + cls + '">' +
      '<div class="counter-top"><span class="counter-label">' + esc(c.label) + '</span>' + mine + '</div>' +
      body + sub + '</div>';
  }).join("");

  strip.innerHTML = '<div class="counters-inner">' +
    '<div class="counters-head"><span class="label">Counters at ' + esc(loc(locId).name) + '</span>' +
    '<span class="dense soft">Labels come from the branch record. Rename them in Counters and services.</span></div>' +
    '<div class="counter-grid">' + tiles + '</div>' +
    spec('<b>GET /api/counters?locationId</b> &mdash; labels are data (<code>Counter 1..3</code> are the seeded defaults, not hardcoded strings). ' +
         'Gap s6: counters are <b>not seeded in prod</b>; this strip renders the empty-counter state until that gated seed lands.') +
    '</div>';
}

/* ==========================================================================
   RENDER — THE LINE
   ========================================================================== */
const DETOUR = '<svg class="detour" viewBox="0 0 28 100" preserveAspectRatio="none" aria-hidden="true">' +
  '<path d="M14 0 C14 18 4 24 4 50 C4 76 14 82 14 100" vector-effect="non-scaling-stroke"/></svg>';

function entryActions(e, isNext){
  if (S.role === "admin") return "";
  const dis = S.mode === "degraded" ? " disabled" : "";
  const B = (cls, verb, label) => '<button class="btn btn-sm ' + cls + '" data-act="verb" data-verb="' + verb + '" data-id="' + e.id + '"' + dis + '>' + label + '</button>';
  switch(e.status){
    case "provisional":
      return B("btn-primary","confirm","Confirm") + B("btn-ghost","remove","Remove");
    case "waiting":
      return (isNext
        ? '<button class="btn btn-sm btn-primary" data-act="call-this" data-id="' + e.id + '"' + dis + '>Call to my counter</button>'
        : '<button class="btn btn-sm btn-ghost btn-oo" data-act="call-oo" data-id="' + e.id + '"' + dis + '>Call out of order</button>')
        + B("btn-ghost","leave","Left the line");
    case "called":
      return B("btn-primary","check-in","Check in") + B("btn-danger","no-show","No-show") + B("btn-ghost","undo-call","Undo call");
    case "serving":
      return B("btn-primary","complete","Complete") + B("btn-ghost","undo-check-in","Undo check-in");
    default:
      return "";
  }
}

function entryRow(e, i, isNext){
  const stepped = !!e.steppedOver;
  const name = e.name
    ? esc(e.name)
    : '<span class="unnamed">No name yet. ' + esc(e.contact || "No contact on file either.") + '</span>';
  const survey = e.status === "served" && e.survey
    ? (e.survey.achieved == null ? '<span class="sep"></span><span class="soft">Survey sent, no answer yet</span>'
      : e.survey.waitMatch == null ? '<span class="sep"></span><span class="soft">Survey 1 of 2, left half-answered</span>'
      : '<span class="sep"></span><span class="soft">Survey 2 of 2</span>')
    : "";
  return '<li class="entry st-' + e.status + (stepped ? " is-stepped" : "") + '">' +
    '<div class="rail">' + (stepped ? DETOUR : "") + '<span class="rail-seg"></span><span class="node"></span></div>' +
    '<div class="ticket"><div class="ticket-no">' + e.t + '</div><div class="ticket-time">' + e.at + '</div></div>' +
    '<div class="who"><div class="who-name">' + name + '</div>' +
      '<div class="who-line">' +
        '<span class="pill pill-' + e.status + '">' + statusPill(e) + '</span>' +
        '<span class="sep"></span><span>' + esc(svcLabel(e.st)) + '</span>' +
        '<span class="sep"></span><span class="chan">' + chanIcon(e.ch) + chanLabel(e.ch) + '</span>' +
        (e.counter ? '<span class="sep"></span><span>' + esc((counters().find(c=>c.id===e.counter)||{}).label||"") + '</span>' : "") +
        survey +
      '</div></div>' +
    '<div class="acts">' + (stepped ? "" : entryActions(e, isNext)) + '</div>' +
    (stepped ? '<div class="stepped-note"><b>Stepped over</b>' + esc(e.steppedOverReason) +
        (S.role === "admin" ? "" :
        '<div class="fix"><button class="btn btn-sm btn-primary" data-act="verb" data-verb="confirm" data-id="' + e.id + '"' +
          (S.mode === "degraded" ? " disabled" : "") + '>Confirm and restore</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="verb" data-verb="remove" data-id="' + e.id + '"' +
          (S.mode === "degraded" ? " disabled" : "") + '>Remove from line</button></div>') + '</div>' : "") +
  '</li>';
}
function statusPill(e){
  return { provisional:"Not confirmed", waiting:"Waiting", called:"Called", serving:"Serving",
           served:"Served", noshow:"No-show", left:"Left" }[e.status] || e.status;
}

function skeletonLine(n){
  let out = "";
  for (let i=0;i<n;i++) out +=
    '<li class="skel-row"><div></div><div class="skel" style="width:52px"></div>' +
    '<div><div class="skel" style="width:' + (120+((i*37)%110)) + 'px;height:14px"></div>' +
    '<div class="skel" style="width:' + (170+((i*53)%90)) + 'px;margin-top:8px"></div></div>' +
    '<div class="skel" style="width:150px;height:30px"></div></li>';
  return '<ul class="line">' + out + '</ul>';
}

function emptyLine(){
  return '<div class="empty">' + ICON.line.replace("<svg","<svg class=\"e-mark\"") +
    '<h3>No one is in line</h3>' +
    '<p>The branch is open and the counters are clear. Reception can add a walk-in, or a customer can join from WhatsApp or the QR code at the door.</p>' +
    (S.role === "admin" ? "" : '<button class="btn btn-primary" data-act="goto" data-screen="reception">Add a walk-in</button>') +
    '</div>';
}
</script>
<script>
"use strict";
/* ==========================================================================
   REFUSAL STRIP — presented in place, calmly, never as a crash.
   ========================================================================== */
function refusalHTML(){
  if (!S.refusal) return "";
  return '<div class="refusal" role="alert">' + ICON.warn +
    '<div><div class="r-title">' + esc(S.refusal.title) + '<span class="r-code">HTTP ' + (S.refusal.code||409) + '</span></div>' +
    '<div>' + esc(S.refusal.detail) + '</div></div>' +
    '<button class="refusal-close" data-act="dismiss" aria-label="Dismiss">' + ICON.x + '</button></div>';
}

/* ==========================================================================
   SCREEN: THE LINE (clerk + manager)
   ========================================================================== */
function screenBoard(){
  const board = getBoard();
  const stale = S.mode === "degraded" ? " is-stale" : "";
  const q = S.mode === "loading" ? [] : board.value.queue;
  const waiting = q.filter(e => e.status === "waiting");
  const nextId = waiting.length ? waiting[0].id : null;

  let list;
  if (S.mode === "loading") list = skeletonLine(6);
  else if (!q.length) list = emptyLine();
  else list = '<ul class="line' + stale + '">' +
      q.map((e,i) => entryRow(e, i, e.id === nextId)).join("") + '</ul>';

  const stepped = q.filter(e => e.steppedOver).length;

  return refusalHTML() +
  '<div class="section-head"><div class="sh-l">' +
    '<h2 class="screen-title">The line</h2>' +
    '<span class="dense muted">' + (S.mode==="loading" ? "Loading" : q.length + " in line") +
    (stepped ? ' &middot; <span style="color:var(--ochre);font-weight:600">' + stepped + ' stepped over</span>' : '') + '</span>' +
  '</div>' +
  '<div class="dense soft">Ordered by the time each person joined. Never re-sorted.</div></div>' +
  '<p class="section-note" style="margin-bottom:16px">Nobody moves up this list by anything other than being served, leaving, or an out-of-order call that a manager put their name to.</p>' +
  spec('<b>GET /api/board?locationId</b> &rarr; <code>{queue, totals, events, estimate}</code>. ' +
       '<b>I1</b>: render order is join time, full stop &mdash; no client-side sort control exists on this screen, by design. ' +
       '<b>I8</b>: <code>steppedOver</code> from the API drives the detour in the spine and the note beneath the row; it is never collapsed into a tooltip.') +
  list;
}

/* ==========================================================================
   SCREEN: RECEPTION JOIN — the only simulated flow (R6)
   ========================================================================== */
function screenReception(){
  const dis = S.mode === "degraded" ? " disabled" : "";
  return refusalHTML() +
  '<div class="section-head"><div class="sh-l"><h2 class="screen-title">Add a walk-in</h2></div>' +
  '<div class="dense soft">Joins the line at the current time</div></div>' +
  '<p class="section-note" style="margin-bottom:18px">Use this when someone comes to the desk instead of joining by WhatsApp or QR. They take their real place in the line from the moment you save.</p>' +
  '<div class="panel" style="max-width:680px">' +
    '<div class="panel-head"><span class="label">Walk-in details</span></div>' +
    '<div class="panel-body">' +
      '<div class="field"><label for="wName">Name</label>' +
        '<input class="input" id="wName" placeholder="As the customer gives it" autocomplete="off">' +
        '<div class="hint">Staff call people by name at the counter. If someone will not give one, leave it blank and the ticket number stands in.</div></div>' +
      '<div class="form-grid">' +
        '<div class="field"><label for="wPhone">Mobile number</label>' +
          '<input class="input" id="wPhone" placeholder="876 000 0000" inputmode="tel" autocomplete="off">' +
          '<div class="hint">Optional. Only used to text them when their turn comes.</div></div>' +
        '<div class="field"><label for="wSvc">What they are here for</label>' +
          '<select class="select" id="wSvc">' + SERVICE_TYPES.map(s=>'<option value="'+s.code+'">'+esc(s.label)+'</option>').join("") + '</select>' +
          '<div class="hint">Provisional list. See the note in the panel on the right.</div></div>' +
      '</div>' +
      '<div class="field"><label>How they joined</label>' +
        '<div class="choice-row">' +
          '<label class="choice is-on"><input type="radio" name="ch" value="reception" checked> Reception desk</label>' +
          '<label class="choice"><input type="radio" name="ch" value="qr"> QR code at the door</label>' +
        '</div></div>' +
      '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:18px">' +
        '<button class="btn btn-primary btn-lg" data-act="join"' + dis + '>Add to the line</button>' +
        '<button class="btn btn-lg" data-act="goto" data-screen="board">Cancel</button>' +
      '</div>' +
      spec('<b>POST /api/join</b> <code>{locationId, channel:"reception"|"qr", contact?, name?}</code>. ' +
           'Gap s6: <code>name</code> <b>does not exist on the entry schema yet</b> &mdash; this field is designed through an additive migration the HMS build must land, plus the matching WhatsApp prompt. ' +
           'Until it does, the field is hidden and every row falls back to the ticket number.') +
    '</div>' +
  '</div>';
}

/* ==========================================================================
   SCREEN: SERVED TODAY
   ========================================================================== */
function screenServed(){
  const done = entriesFor().filter(e => ["served","noshow","left"].includes(e.status));
  if (S.mode === "loading") return skeletonLine(5);
  const rows = done.length ? done.map(e => {
    const s = e.survey;
    const sv = !s ? '<span class="soft">Not sent</span>'
      : s.achieved == null ? '<span class="soft">Sent, no answer</span>'
      : s.waitMatch == null ? '<span style="color:var(--ochre);font-weight:600">1 of 2</span> <span class="soft">left half-answered</span>'
      : '<span style="color:var(--green);font-weight:600">2 of 2</span>';
    return '<tr><td class="strong">' + e.t + '</td><td class="nm">' + esc(nameOf(e)) + '</td>' +
      '<td>' + esc(svcLabel(e.st)) + '</td><td>' + e.at + '</td>' +
      '<td><span class="pill pill-' + e.status + '">' + statusPill(e) + '</span></td>' +
      '<td>' + sv + '</td></tr>';
  }).join("") : '<tr><td colspan="6" style="padding:32px;text-align:center" class="soft">No one has finished at this branch today.</td></tr>';

  return refusalHTML() +
  '<div class="section-head"><div class="sh-l"><h2 class="screen-title">Served today</h2></div>' +
  '<div class="dense soft">' + done.length + ' finished</div></div>' +
  '<div class="panel"><div class="panel-body tight"><table class="tbl">' +
    '<thead><tr><th>Ticket</th><th>Name</th><th>Service</th><th>Joined</th><th>Outcome</th><th>Survey</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div></div>' +
  spec('Survey column shows the true count, not a rate. <b>A half-answered survey stays half-answered</b> &mdash; the second question is never inferred from the first and the row is never rounded up to complete.');
}

/* ==========================================================================
   SCREEN: CUSTOMER PHONE — the simulated handset, restored.
   This is the fallback surface that lets the deployed system run the COMPLETE
   demo moment with Twilio unavailable, including the customer side. It reads
   the same inbox the simulated transport writes and offers only the actions a
   customer's thumb has: join, YES, the two survey answers. While Twilio is
   carrying the traffic this inbox is empty ON PURPOSE and says so; nothing
   here touches or races the live path.
   ========================================================================== */
function screenPhone(){
  const e = S.phoneEntryId ? DB.entries.find(function(x){ return x.id === S.phoneEntryId; }) : null;
  const dis = S.mode === "degraded" ? " disabled" : "";

  const bubbles = S.phoneInbox.length
    ? S.phoneInbox.map(function(m){
        return '<div style="background:var(--field-sunk);border:1px solid var(--hair-field);border-radius:10px 10px 10px 3px;padding:10px 13px;margin-bottom:9px;max-width:85%;font-size:var(--t-dense)">' +
          esc(m.body || "") + '</div>';
      }).join("")
    : '<div class="empty" style="margin:0"><h3>No messages on this handset</h3><p>' +
      (e ? "Messages appear here when the SIMULATED transport carries them. If Twilio is carrying the traffic, the real handset gets them instead \u2014 which is the point."
         : "Join the line as a WhatsApp customer below and the conversation starts here.") + '</p></div>';

  let actions = "";
  if (!e){
    actions = '<button class="btn btn-primary" data-act="phone-join"' + dis + '>Join the line by WhatsApp (simulated)</button>';
  } else if (e.status === "provisional"){
    actions = '<button class="btn btn-primary" data-act="phone-yes"' + dis + '>Reply YES \u2014 confirm my place</button>' +
              '<button class="btn btn-ghost" data-act="phone-leave"' + dis + '>Leave the line</button>';
  } else if (S.phoneSurveyOpen){
    actions = '<div class="dense soft" style="margin-bottom:8px">Reply to the survey:</div>' +
      '<button class="btn" data-act="phone-survey" data-achieved="true" data-wait="as_expected"' + dis + '>Yes \u00b7 about right</button>' +
      '<button class="btn" data-act="phone-survey" data-achieved="true" data-wait="longer"' + dis + '>Yes \u00b7 longer than expected</button>' +
      '<button class="btn" data-act="phone-survey" data-achieved="false" data-wait="as_expected"' + dis + '>No \u00b7 about right</button>';
  } else if (ACTIVE.includes(e.status)){
    actions = '<div class="dense soft">Waiting for the branch. Status: ' + esc(e.status) + '.</div>' +
              (e.status === "waiting" ? '<button class="btn btn-ghost" data-act="phone-leave"' + dis + '>Leave the line</button>' : '');
  } else {
    actions = '<div class="dense soft">This visit is finished.</div>' +
              '<button class="btn btn-primary" data-act="phone-join"' + dis + '>Join again (new simulated customer)</button>';
  }

  return refusalHTML() +
  '<div class="section-head"><div class="sh-l"><h2 class="screen-title">Customer phone</h2>' +
    '<span class="dense muted">Simulated handset</span></div>' +
    '<div class="dense soft">' + (e ? "Following " + esc(nameOf(e)) + " \u00b7 " + esc(e.status) : "No remote customer yet") + '</div></div>' +
  '<p class="section-note" style="margin-bottom:16px">The fallback surface. When Twilio is unavailable the whole demo \u2014 including the customer\u2019s side \u2014 runs through this screen against the same API, the same queue, the same rules.</p>' +
  '<div class="panel" style="max-width:560px"><div class="panel-head"><span class="label">Conversation</span>' +
    '<span class="dense soft">' + (e ? "entry " + e.t : "") + '</span></div>' +
    '<div class="panel-body">' + bubbles + '</div></div>' +
  '<div style="display:flex;gap:9px;flex-wrap:wrap;max-width:560px">' + actions + '</div>';
}

/* ==========================================================================
   SCREEN: DASHBOARD (manager)
   ========================================================================== */
function screenDashboard(){
  const d = DB.dashboard;
  if (S.mode === "loading" || !d) return dashSkeleton();
  const t = DB.totals[S.loc] || { joined:0, served:0, noshow:0, left:0 };
  const totalServed = d.serviceTypes.reduce(function(a,x){ return a + x.stats.count; }, 0);
  const sv = d.surveys;

  return refusalHTML() +
  '<div class="section-head"><div class="sh-l"><h2 class="screen-title">Dashboard</h2>' +
    '<span class="dense muted">Last ' + d.windowDays + ' days</span></div></div>' +

  '<div class="figures">' +
    fig("In line now", queueFor().length, "at this branch", "") +
    fig("Served today", t.served, "of " + t.joined + " who joined", "accent") +
    fig("No-shows", t.noshow, "called and did not come", "warn") +
    fig("Left the line", t.left, "gave up before being called", "") +
  '</div>' +

  '<div class="panel"><div class="panel-head"><span class="label">Service, by type</span>' +
    '<span class="dense soft">Last ' + d.windowDays + ' days</span></div>' +
    '<div class="provisional-note">' + ICON.info + '<div><b>Provisional.</b> ' + esc(PROVISIONAL_NOTE) + '</div></div>' +
    '<div class="panel-body tight"><table class="tbl">' +
    '<thead><tr><th>Service type</th><th class="num">Served</th><th class="num">Median service</th><th style="width:30%">Share</th></tr></thead><tbody>' +
    (d.serviceTypes.length ? d.serviceTypes.map(function(x){
      const pct = totalServed === 0 ? 0 : Math.round(x.stats.count / totalServed * 100);
      const med = x.stats.medianMinutes === null ? '<span class="soft">\u2014</span>'
        : Math.round(x.stats.medianMinutes) + ' min' + (x.stats.provisional ? ' <span class="soft">(provisional, n=' + x.stats.count + ')</span>' : '');
      return '<tr><td class="strong">' + esc(x.label) + '</td><td class="num">' + x.stats.count + '</td>' +
        '<td class="num">' + med + '</td>' +
        '<td><span class="dense">' + pct + '%</span><div class="bar"><i style="width:' + pct + '%"></i></div></td></tr>';
    }).join("") : '<tr><td colspan="4" style="padding:24px;text-align:center" class="soft">Nothing completed in this window yet.</td></tr>') +
    '</tbody></table></div></div>' +

  '<div class="panel"><div class="panel-head"><span class="label">Survey results</span>' +
    '<span class="dense soft">Two questions, asked once</span></div><div class="panel-body">' +
    '<div class="figures" style="margin:0">' +
      fig("Got what they came for", sv.achievedYes + " of " + sv.achievedOf, "answered question one", "accent") +
      fig("Wait matched what we told them", sv.waitMatched + " of " + sv.waitMatchedOf, "answered question two", "") +
      fig("Half-answered", sv.halfAnswered, "answered one, stopped there", "warn") +
      fig("Never answered", sv.neverAnswered, "survey sent, no reply", "") +
    '</div>' +
  '</div></div>' +

  '<div class="panel"><div class="panel-head"><span class="label">What we said against what happened</span>' +
    '<span class="dense soft">Estimate calibration</span></div><div class="panel-body">' +
    '<div class="figures" style="margin:0">' +
      fig("Estimates given", d.calibration.predicted, "with a stored range", "") +
      fig("Landed inside the range", d.calibration.within, "of " + d.calibration.predicted, "accent") +
      fig("Quicker than promised", d.calibration.under, "called before the low end", "") +
      fig("Slower than promised", d.calibration.over, "called after the high end", "warn") +
    '</div>' +
  '</div></div>' +

  '<div class="panel"><div class="panel-head"><span class="label">How to read this page</span></div>' +
    '<div class="panel-body"><ul class="log">' +
      d.notes.map(function(n){ return '<li><span class="t"></span><span class="ev">' + esc(n) + '</span></li>'; }).join("") +
    '</ul></div></div>';
}
function fig(label, value, sub, cls){
  return '<div class="fig ' + (cls||"") + '"><div class="label">' + esc(label) + '</div>' +
    '<div class="figure">' + esc(String(value)) + '</div>' +
    '<div class="fig-sub">' + esc(sub) + '</div></div>';
}
function dashSkeleton(){
  return '<div class="figures">' + [1,2,3,4,5].map(()=>'<div class="fig">' +
    '<div class="skel" style="width:60%"></div><div class="skel" style="width:44%;height:26px;margin-top:10px"></div>' +
    '<div class="skel" style="width:76%;margin-top:9px"></div></div>').join("") + '</div>' +
    '<div class="panel"><div class="panel-body">' + [1,2,3,4].map(()=>'<div class="skel" style="margin-bottom:14px"></div>').join("") + '</div></div>';
}
</script>
<script>
"use strict";
/* ==========================================================================
   SCREEN: ADHERENCE (manager) — a report. It deliberately offers no actions.
   ========================================================================== */
function screenAdherence(){

  '<div class="figures">' +
    fig("Calls made", tc, "across the window", "") +
    fig("In join order", inO + " of " + tc, tc ? (Math.round(inO/tc*1000)/10 + "% of calls") : "no calls yet", "accent") +
    fig("Out of order", oo, "each one needs a named approver", oo ? "warn" : "") +

  (a.findings.length
    ? '<div class="refusal" role="alert" style="margin-bottom:16px">' + ICON.warn + '<div>' +
      a.findings.map(function(f){ return '<div>' + esc(f) + '</div>'; }).join("") + '</div></div>'
    : '') +

  '<div class="panel"><div class="panel-head"><span class="label">Counter by counter</span></div>' +
  '<div class="panel-body tight"><table class="tbl"><thead><tr>' +
    '<th>Counter</th><th class="num">Calls</th><th class="num">In order</th><th class="num">Approved overrides</th>' +
    '<th class="num">Unapproved</th><th class="num">Adherence</th></tr></thead><tbody>' +
    (a.perCounter.length ? a.perCounter.map(function(r){
      const rate = r.adherence.rate === null ? '<span class="soft">\u2014</span>'
        : (Math.round(r.adherence.rate*1000)/10) + '%' + (r.adherence.provisional ? ' <span class="soft">(provisional)</span>' : '');

        '<td class="num">' + rate + '</td></tr>';

  '</tbody></table></div></div>' +

  '<div class="panel"><div class="panel-head"><span class="label">Posture</span></div>' +
    '<div class="panel-body"><ul class="log">' +
      a.notes.map(function(n){ return '<li><span class="t"></span><span class="ev">' + esc(n) + '</span></li>'; }).join("") +
    '</ul></div></div>';
}

/* ==========================================================================
   SCREEN: OUT-OF-ORDER REQUESTS (manager, I7)
   ========================================================================== */
function screenApprovals(){
  if (S.mode === "loading") return dashSkeleton();

    '<div class="section-head"><div class="sh-l"><h2 class="screen-title">Out-of-order requests</h2></div></div>' +
    '<div class="empty"><h3>Nothing is waiting on you</h3><p>When a clerk needs to call someone ahead of the line, the request lands here with the reason they gave. You decide, and your name goes on the record.</p></div>';

    '<div class="panel-head"><span class="label">' + esc(a.t) + ' &middot; ' + esc(a.who) + '</span>' +
      '<span class="dense soft">Raised ' + a.at + ' by ' + esc(a.raisedBy) + '</span></div>' +
    '<div class="panel-body">' +
      '<div class="consequence"><strong>' + esc(a.who) + '</strong> would be called ahead of <strong>' + a.ahead + ' ' +

      '<div class="field"><label>Reason the clerk gave</label>' +
        '<div class="dense" style="padding:9px 11px;background:var(--field-sunk);border:1px solid var(--hair-field);border-radius:var(--r-md)">' + esc(a.reason) + '</div></div>' +

}

/* ==========================================================================
   SCREEN: CLOSE OF DAY (manager — CC recommendation, flagged in s6)

  '<p class="section-note" style="margin-bottom:18px">Closing ends the day for this branch. Anyone still in line is recorded as still in line at close, not quietly marked served.</p>' +

    '<div class="panel-head"><span class="label">What will be written</span></div>' +
    '<div class="panel-body">' +
      '<div class="figures" style="margin-bottom:16px">' +
        fig("Joined", t.joined, "all channels", "") +
        fig("Served", t.served, "completed at a counter", "accent") +
        fig("No-show", t.noshow, "called, did not come", "warn") +
        fig("Left", t.left, "gave up before being called", "") +
      '</div>' +
      (blocked

          '<div><div class="r-title">' + q.length + ' people are still in line</div>' +

        '<button class="btn btn-lg" data-act="goto" data-screen="board">Back to the line</button></div>' +
      spec('<b>POST /api/close-of-day {locationId}</b>. Gap s6: permission is <b>UNRULED</b>. Placed under Manager per the CC recommendation and flagged here. ' +

}

/* ==========================================================================

<script>
"use strict";
/* ==========================================================================
   ADMIN — multi-branch. Endpoints do not exist yet (gap s6); the screens are
   designed through that gap so the aggregation has a shape to satisfy.
   ========================================================================== */
function screenNetwork(){
  const ov = DB.overview;
  if (S.mode === "loading" || !ov) return dashSkeleton();
  if (!ov.length) return '<div class="empty"><h3>No branches are set up</h3>' +
    '<p>Add a branch to start. Each one gets its own line, its own counters and its own record.</p></div>';

  const rows = ov.map(function(b){
    const inLine = b.waiting + b.provisional + b.called + b.serving;
    return { b:b, q:inLine, strain: inLine >= 8 };
  });
  const totalLine = rows.reduce(function(a,r){ return a+r.q; },0);
  const totalServed = rows.reduce(function(a,r){ return a+r.b.servedToday; },0);

  return refusalHTML() +
  '<div class="section-head"><div class="sh-l"><h2 class="screen-title">All branches</h2>' +
    '<span class="dense muted">' + ov.length + (ov.length===1?' branch':' branches') + ' &middot; Jamaica</span></div>' +
    '<div class="dense soft">Live, ' + S.clock + '</div></div>' +

  '<div class="figures">' +
    fig("In line, everywhere", totalLine, "right now", "") +
    fig("Served today", totalServed, "across all branches", "accent") +
    fig("No-shows today", rows.reduce(function(a,r){ return a+r.b.noshowToday; },0), "called and did not come", "") +
    fig("Left the line today", rows.reduce(function(a,r){ return a+r.b.leftToday; },0), "gave up before being called", "") +

  '<div class="branch-cards">' + rows.map(function(r){

      '<div class="bcard-head"><div class="bcard-name">' + esc(r.b.name) + '</div>' +
        '<div class="plate-meta" style="margin-top:6px">' +
          '<span class="branch-state">Serving today</span>' +
          '<span class="dot"></span><span>' + esc(r.b.timezone) + '</span></div></div>' +
      '<div class="bcard-figs">' +
        '<div><div class="label">In line</div><div class="v"' + (r.strain?' style="color:var(--ochre)"':'') + '>' + r.q + '</div></div>' +
        '<div><div class="label">Served</div><div class="v">' + r.b.servedToday + '</div></div>' +
        '<div><div class="label">Counters open</div><div class="v">' + r.b.countersOpen +

  '<div class="section-head"><div class="sh-l">' +

    '<h2 class="screen-title">' + esc(b.name) + '</h2></div>' +

    }).join("") + '</div></div>' +

function screenCompare(){
  const ov = DB.overview;
  if (S.mode === "loading" || !ov) return dashSkeleton();
  const metrics = [
    { m:"In line now",     v:function(b){ return String(b.waiting + b.provisional + b.called + b.serving); } },
    { m:"Served today",    v:function(b){ return String(b.servedToday); } },
    { m:"No-shows today",  v:function(b){ return String(b.noshowToday); } },
    { m:"Left the line",   v:function(b){ return String(b.leftToday); } },
