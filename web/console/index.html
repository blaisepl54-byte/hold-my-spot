    }).join("") +
  '</tbody></table></div></div>' +
  spec('<b>GET /api/admin/overview</b>. Wait and adherence columns arrive when the cross-branch window aggregation is built; this table shows only what the API answers today rather than inventing the rest.');
}

/* ==========================================================================
   THE CONTEXT RAIL
   ========================================================================== */
function renderRail(){
  const rail = $("#railCol");
  const hide = (S.role === "admin" && S.screen !== "branch");
  document.body.classList.toggle("no-rail", hide);
  if (hide){ rail.style.display = "none"; return; }
  rail.style.display = "";
  const locId = (S.role==="admin" && S.screen==="branch") ? S.drillLoc : S.loc;

  if (S.mode === "loading"){
    rail.innerHTML = '<div class="stack">' + [1,2,3].map(()=>'<div class="panel"><div class="panel-body">' +
      '<div class="skel" style="width:48%"></div><div class="skel" style="width:82%;margin-top:12px;height:20px"></div>' +
      '<div class="skel" style="width:66%;margin-top:10px"></div></div></div>').join("") + '</div>';
    return;
  }

  const est = getEstimate(locId);
  const t = S.mode === "empty" ? { joined:0, served:0, noshow:0, left:0 } : DB.totals[locId];
  const q = S.mode === "empty" ? [] : DB.entries.filter(e => e.loc===locId && ACTIVE.includes(e.status));

  const estBlock =
    '<div class="estimate' + (est.refused ? " is-refused" : "") + '">' +
      '<div class="label">Wait estimate</div>' +
      '<div class="dense soft" style="margin-top:2px">' + (est.refused ? "What we can honestly say" : "For the next person called") + '</div>' +
      '<div class="estimate-value">' + esc(est.rendered) + '</div>' +
      '<div class="basis"><span class="label-quiet">Basis</span><span>' + esc(est.basis) + '</span></div>' +
    '</div>' +
    spec('<b>R-G</b>: the estimate is displayed exactly as the API renders it. There is no code path in this component that produces a single number, ' +
         'and the refusal is styled as an <b>answer</b>, not an empty state. <code>basis</code> is always shown, so a range can be argued with.');

  const totalsBlock =
    '<div class="panel"><div class="panel-head"><span class="label">Today at this branch</span></div>' +
    '<div class="panel-body tight"><table class="tbl">' +
      '<tr><td>In line now</td><td class="num strong">' + q.length + '</td></tr>' +
      '<tr><td>Joined today</td><td class="num strong">' + t.joined + '</td></tr>' +
      '<tr><td>Served</td><td class="num strong" style="color:var(--green)">' + t.served + '</td></tr>' +
      '<tr><td>No-show</td><td class="num strong">' + t.noshow + '</td></tr>' +
      '<tr><td>Left the line</td><td class="num strong">' + t.left + '</td></tr>' +
    '</table></div></div>';

  const logBlock =
    '<div class="panel"><div class="panel-head"><span class="label">What the branch did</span></div>' +
    '<div class="panel-body"><ul class="log">' +
      DB.log.slice(0,7).map(e => '<li><span class="t">' + e.t + '</span>' +
        '<span class="ev ' + (e.kind==="over"?"over":e.kind==="step"?"step":"") + '">' + e.text + '</span></li>').join("") +
    '</ul></div></div>';

  const svcBlock =
    '<div class="panel"><div class="panel-head"><span class="label">Service types</span></div>' +
    '<div class="provisional-note">' + ICON.info + '<div>' + esc(PROVISIONAL_NOTE) + '</div></div>' +
    '<div class="panel-body tight"><table class="tbl">' +
      SERVICE_TYPES.map(s => '<tr><td>' + esc(s.label) + '</td>' +
        '<td class="num strong">' + q.filter(e=>e.st===s.code).length + '</td></tr>').join("") +
    '</table></div></div>';

  rail.innerHTML = '<div class="stack">' + estBlock + totalsBlock + logBlock + svcBlock + '</div>';
}

<script>
"use strict";
/* ==========================================================================
   OUT-OF-ORDER MODAL (I7)
   The confirm button cannot be reached until a named approver exists.
   ========================================================================== */
let ooTarget = null;
function openOverride(id){
  ooTarget = id;
  const e = DB.entries.find(x=>x.id===id);
  const waiting = queueFor().filter(x=>x.status==="waiting");
  const ahead = waiting.indexOf(e);
  const aheadNames = waiting.slice(0, ahead).map(x=>nameOf(x));
  const managers = STAFF.filter(s=>s.role==="manager"||s.role==="admin");

  $("#modalRoot").innerHTML =
  '<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="ooTitle">' +
    '<div class="modal-head"><div class="label" style="color:var(--ochre-text)">Out-of-order call</div>' +
      '<h2 class="screen-title" id="ooTitle">Call ' + esc(nameOf(e)) + ' ahead of the line</h2></div>' +
    '<div class="modal-body">' +
      '<div class="consequence">This call passes <strong>' + ahead + ' ' + (ahead===1?"person":"people") + '</strong> who joined before ' +
        esc(nameOf(e)) + ':<br><span class="muted">' + esc(aheadNames.join(", ")) + '</span><br><br>' +
        'They keep their places. They wait longer. The record will show your name, the approver, and the reason, for as long as this branch keeps records.</div>' +
      '<div class="field"><label for="ooApprover">Who approved this call</label>' +
        '<select class="select" id="ooApprover">' +
          '<option value="">Choose the person who approved it</option>' +
          managers.map(m=>'<option value="' + esc(m.name + ", " + m.title) + '">' + esc(m.name) + ' &mdash; ' + esc(m.title) + '</option>').join("") +
          '<option value="__other">Someone else, type the name</option>' +
        '</select>' +
        '<div class="hint">A role is not an approver. This records a person.</div></div>' +
      '<div class="field" id="ooOtherWrap" style="display:none"><label for="ooOther">Name and title</label>' +
        '<input class="input" id="ooOther" placeholder="Full name, job title" autocomplete="off"></div>' +
      '<div class="field" style="margin-bottom:0"><label for="ooReason">Reason</label>' +
        '<textarea class="textarea" id="ooReason" placeholder="What made this call necessary. Written in plain words, for someone reading it in six months."></textarea></div>' +
    '</div>' +
    '<div class="modal-foot">' +
      '<button class="btn" data-act="close-modal">Cancel</button>' +
      '<button class="btn btn-ochre" id="ooConfirm" disabled>Approve and call</button>' +
    '</div>' +
  '</div></div>';

  const sel = $("#ooApprover"), other = $("#ooOther"), wrap = $("#ooOtherWrap"),
        reason = $("#ooReason"), confirm = $("#ooConfirm");
  function sync(){
    const named = sel.value === "__other" ? other.value.trim() : sel.value.trim();
    wrap.style.display = sel.value === "__other" ? "" : "none";
    confirm.disabled = !(named && reason.value.trim());
    confirm.textContent = named ? "Approve as " + named.split(",")[0] + " and call" : "Approve and call";
  }
  sel.addEventListener("change", sync);
  other.addEventListener("input", sync);
  reason.addEventListener("input", sync);
  confirm.addEventListener("click", function(){
    const named = sel.value === "__other" ? other.value.trim() : sel.value.trim();
    confirm.disabled = true;
    callOutOfOrder(ooTarget, named, reason.value.trim()).then(function(res){
      closeModal();
      S.refusal = res.ok ? null : res.reason;
      render();
    });
  });
  sel.focus();
}
function closeModal(){ $("#modalRoot").innerHTML = ""; ooTarget = null; }

/* ==========================================================================
   MAIN RENDER + ROUTING
   ========================================================================== */
const VIEWS = {
  board: screenBoard, reception: screenReception, served: screenServed, phone: screenPhone,
  dashboard: screenDashboard, adherence: screenAdherence, approvals: screenApprovals,
  closeofday: screenCloseOfDay, setup: screenSetup,
  network: screenNetwork, branch: screenBranchDetail, compare: screenCompare
};
function render(){
  if (!SCREENS[S.role].some(s => s.id === S.screen)) S.screen = SCREENS[S.role][0].id;
  renderChrome();
  renderCounters();
  $("#mainCol").innerHTML = (VIEWS[S.screen] || screenBoard)();
  renderRail();
  document.body.classList.toggle("show-spec", S.showSpec);
}

/* ==========================================================================
   EVENTS
   ========================================================================== */
document.addEventListener("click", function(ev){
  const roleBtn = ev.target.closest(".role-tab");
  if (roleBtn){
    S.role = roleBtn.dataset.role; S.screen = SCREENS[S.role][0].id; S.refusal = null;
    render(); ensureScreenData().then(paintSafe); return;
  }

  const subBtn = ev.target.closest(".sub-tab");
  if (subBtn){
    S.screen = subBtn.dataset.screen; S.refusal = null;
    render(); ensureScreenData().then(paintSafe); return;
  }

  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;

  if (act === "scrim" && ev.target === el){ closeModal(); return; }
  if (act === "close-modal"){ closeModal(); return; }
  if (act === "dismiss"){ S.refusal = null; render(); return; }
  if (act === "goto"){ S.screen = el.dataset.screen; S.refusal = null; render(); return; }
  if (act === "drill"){
    S.drillLoc = el.dataset.loc; S.screen = "branch"; S.refusal = null; DB.drill = null;
    render(); ensureScreenData().then(paintSafe); return;
  }

  if (act === "call-next"){
    callNext(el.dataset.counter).then(function(res){
      S.refusal = res.ok ? null : res.reason; render();
    });
    return;
  }
  if (act === "call-this"){
    /* "Call to my counter" is offered only on the next person in line, so it
       IS call-next addressed to my counter. One write path, not two. */
    callNext(S.myCounter).then(function(res){
      S.refusal = res.ok ? null : res.reason; render();
    });
    return;
  }
  if (act === "call-oo"){ openOverride(el.dataset.id); return; }

  if (act === "verb"){
    entryVerb(el.dataset.id, el.dataset.verb).then(function(res){
      S.refusal = res.ok ? null : res.reason; render();
    });
    return;
  }
  if (act === "join"){
    const g = guardWrite();
    if (g){ S.refusal = g.reason; render(); return; }
    const nm = ($("#wName")||{}).value || "";
    const ph = ($("#wPhone")||{}).value || "";
    const svCode = ($("#wSvc")||{}).value || "";
    const svc = SERVICE_TYPES.find(function(x){ return x.code === svCode; });
    const ch = (document.querySelector('input[name="ch"]:checked')||{}).value || "reception";
    apiPOST("/api/join", {
      locationId: S.loc, channel: ch,
      contact: ph.trim() || null,
      name: nm.trim() || null,
      serviceTypeId: svc ? svc.id : null
    }).then(function(res){
      if (!res.ok){ S.refusal = toRefusal(res); render(); return; }
      refreshSnapshot().then(function(){
        S.screen = "board"; S.refusal = null; render();
      });
    });
    return;
  }
  if (act === "approve-req"){
    const a = DB.approvals.find(x=>x.id===el.dataset.id);
    const e = DB.entries.find(x=>x.t===a.t);
    const res = callOutOfOrder(e.id, me().name + ", " + me().title, a.reason);
    DB.approvals = DB.approvals.filter(x=>x.id!==a.id);
    S.refusal = res.ok ? null : res.reason;
    S.screen = "board"; render(); return;
  }
  if (act === "decline-req"){
    const a = DB.approvals.find(x=>x.id===el.dataset.id);
    DB.approvals = DB.approvals.filter(x=>x.id!==el.dataset.id);
    DB.log.unshift({ t:S.clock, kind:"over",
      text:"Out-of-order request for <b>" + esc(a.who) + " (" + a.t + ")</b> was declined by <b>" + esc(me().name) + "</b>. Position in line is unchanged." });
    render(); return;
  }
  if (act === "phone-join"){
    const g = guardWrite();
    if (g){ S.refusal = g.reason; render(); return; }
    /* R11: synthetic contact only. Derived from the clock so repeat demos do
       not collide, and never a real person's number. */
    const synth = "+1876555" + String(Date.now()).slice(-4);
    apiPOST("/api/join", { locationId: S.loc, channel: "whatsapp", contact: synth, name: null })
      .then(function(res){
        if (!res.ok){ S.refusal = toRefusal(res); render(); return; }
        refreshSnapshot().then(function(){ ensureScreenData().then(function(){ S.refusal = null; render(); }); });
      });
    return;
  }
  if (act === "phone-yes"){
    entryVerb(S.phoneEntryId, "confirm").then(function(res){
      S.refusal = res.ok ? null : res.reason;
      ensureScreenData().then(function(){ render(); });
    });
    return;
  }
  if (act === "phone-leave"){
    entryVerb(S.phoneEntryId, "leave").then(function(res){
      S.refusal = res.ok ? null : res.reason;
      ensureScreenData().then(function(){ render(); });
    });
    return;
  }
  if (act === "phone-survey"){
    apiPOST("/api/survey", {
      entryId: S.phoneEntryId, locationId: S.loc,
      achieved: el.dataset.achieved === "true", waitMatch: el.dataset.wait
    }).then(function(res){
      S.refusal = res.ok ? null : toRefusal(res);
      ensureScreenData().then(function(){ render(); });
    });
    return;
  }
  if (act === "close-day"){
    const g = guardWrite();
    if (g){ S.refusal = g.reason; render(); return; }
    const still = queueFor().length;
    apiPOST("/api/close-of-day", { locationId: S.loc, actor: me().name }).then(function(res){
      if (!res.ok){ S.refusal = toRefusal(res); render(); return; }
      refreshSnapshot().then(function(){
        S.refusal = { code:200, title:"The day is closed",
          detail:"Recorded at " + S.clock + " by " + me().name + ". " + still + " people were still in line at close and are recorded that way." };
        render();
      });
    });
    return;
  }
});
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeModal(); });

/* choice chip visual state */
document.addEventListener("change", function(ev){
  const c = ev.target.closest(".choice");
  if (!c) return;
  const nm = ev.target.name;
  if (nm) $$('input[name="' + nm + '"]').forEach(i => i.closest(".choice").classList.toggle("is-on", i.checked));
  else c.classList.toggle("is-on", ev.target.checked);
});

/* The design render's review scaffolding (state switcher, armed 409, data
   reset, spec toggle) is gone: state comes from reality now. */

$("#themeToggle").addEventListener("click", function(){
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  this.setAttribute("aria-pressed", String(!dark));
  this.textContent = dark ? "Light" : "Dark";
  render();
});

/* the branch name takes a seat in the section bar once the plate scrolls off */
let ticking = false;
window.addEventListener("scroll", function(){
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(function(){
    document.body.classList.toggle("scrolled", window.scrollY > 130);
    ticking = false;
  });
}, { passive:true });

/* ==========================================================================
   BOOT. Paint the loading skeletons immediately, then let the snapshot land.
   The poll keeps the console honest about a moving branch; it skips the
   repaint while the operator is typing or a modal is open, so a refresh can
   never eat a half-typed name or an approver mid-selection.
   ========================================================================== */
function tickClock(){ S.clock = jamaicaClock(); }
function paintSafe(){
  const a = document.activeElement;
  const typing = a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT");
  if (typing || ooTarget !== null) return;
  render();
}
function startConsole(){
  tickClock();
  render();
  refreshSnapshot().then(function(){ tickClock(); render(); ensureScreenData().then(paintSafe); });
  setInterval(function(){
    tickClock();
    refreshSnapshot().then(function(){ ensureScreenData().then(paintSafe); });
  }, 5000);
}

if (!clerkEnabled()){
  startConsole();
} else {
  loadClerk().then(function(){
    if (!window.Clerk.session){
      showSignInGate("");
      window.Clerk.addListener(function(state){
        if (state.session) window.location.reload();
      });
      return;
    }
    SESSION_USER = sessionFromClerk();
    if (!SESSION_USER || !SESSION_USER.role){
      /* Authenticated but authorized for NOTHING, same rule as the server:
         a missing role never silently becomes desk. */
      showSignInGate("This account has no branch role yet. Ask an administrator to assign one, then sign in again.");
      window.Clerk.mountUserButton(document.getElementById("signInMount"));
      return;
    }
    /* Clerk's role vocabulary says "desk"; the console's screen registry says
       "clerk" (the render's word). Translate at the ONE boundary. Found by the
       fallback walk: a desk sign-in resolved SCREENS["desk"], undefined, and
       the console died on the role it exists to serve. */
    S.role = SESSION_USER.role === "desk" ? "clerk" : SESSION_USER.role;
    startConsole();
  }).catch(function(){
    /* Clerk unreachable: with auth REQUIRED on the API this console cannot
       act, and saying so beats a wall of 401s. */
    showSignInGate("The sign-in service is unreachable. The console cannot start without it.");
  });
}

<script>

const SWATCHES_DARK = [

  { n:"Green",   h:"#0B4B33", t:"--green",   u:"The institution, IN SERVICE, and the single primary action on any screen. Only one green button is ever visible in the line." },
  { n:"Ochre",   h:"#8B530B", t:"--ochre",   u:"Human judgment. Stepped over, out-of-order override, unconfirmed, provisional. Never decorative — if it is ochre, a person has to decide something." },
  { n:"Claret",  h:"#8A2A20", t:"--claret",  u:"Refusal. 409 reasons, no-shows, degraded. Calm and dark, not alarm red — a bank does not shout at its staff." },
  { n:"Slate",   h:"#57503F", t:"--slate",   u:"Secondary text. Warm gray-brown so it belongs to the manila family instead of reading as a foreign gray." },
  { n:"Hair",    h:"#CFC5AC", t:"--hair",    u:"Hairline rules. This system separates with lines, not with shadows and cards." }
];

function screenDesignSystem(){
  return '<div class="section-head"><div class="sh-l"><h2 class="screen-title">Design system</h2>' +
    '<span class="dense muted">HMS-FE-001</span></div>' +
    '<div class="dense soft">Review artifact &mdash; not a product screen</div></div>' +

  '<p class="section-note" style="margin-bottom:20px">Civic ledger structure, Caribbean editorial warmth. The organising idea is that this product claims to make fairness visible, so the queue is drawn as a physical line of service that you can watch bend when someone is passed. Both palettes are one system: identical structure, type and spacing, with only the ground and the three meaning colours re-tuned. Switch between them in the review bar.</p>' +

  '<div class="panel"><div class="panel-head"><span class="label">Colour &mdash; eight values, each with one job</span>' +
    '<span class="dense soft">' + (document.documentElement.getAttribute("data-theme")==="dark" ? "Dark palette" : "Light palette") + '</span></div>' +
  '<div class="panel-body"><div class="ds-grid">' +
    (document.documentElement.getAttribute("data-theme")==="dark" ? SWATCHES_DARK : SWATCHES_LIGHT).map(c =>
    '<div class="sw"><i style="background:' + c.h + '"></i><div class="sw-b">' +
      '<div class="sw-n">' + c.n + '</div><div class="sw-h">' + c.h + ' &middot; ' + c.t + '</div>' +
      '<div class="sw-u">' + esc(c.u) + '</div></div></div>').join("") + '</div>' +
    '<p class="section-note" style="margin-top:14px"><b>The rule that matters:</b> colour is never decorative here. A reviewer should be able to point at any coloured pixel and be told which product truth put it there.</p>' +
  '</div></div>' +

  '<div class="panel"><div class="panel-head"><span class="label">Type &mdash; two families, no more</span></div>' +
  '<div class="panel-body">' +
    '<div class="spec-row"><div class="label">Fraunces</div><div>' +
      '<div class="plate-name">Half-Way Tree Branch</div>' +
      '<div class="dense muted" style="margin-top:6px">Display only, used with restraint: branch name, screen titles, figures, and the person a counter is serving. Its optical-size axis lets the branch plate read as a carved sign while the same face at small sizes reads as a form header.</div>' +
    '</div></div>' +
    '<div class="spec-row"><div class="label">Public Sans</div><div>' +
      '<div style="font-size:1.05rem">Everything else. A civic typeface, drawn for government service interfaces.</div>' +
      '<div class="dense muted" style="margin-top:6px">Tabular lining numerals are on globally, so ticket numbers and times align down a column without a monospace face. There is deliberately no third family and no mono &mdash; the alignment problem it would have solved is already solved.</div>' +
    '</div></div>' +
    '<div class="spec-row"><div class="label">Scale</div><div class="dense">' +
      '<div style="margin-bottom:5px"><span class="plate-name" style="font-size:1.6rem">Plate 25&ndash;38px</span></div>' +
      '<div style="margin-bottom:5px"><span class="screen-title">Screen title 18&ndash;22px</span></div>' +
      '<div style="margin-bottom:5px">Body 15px &middot; Dense 14px</div>' +
      '<div><span class="label">Label 11px uppercase, 0.11em tracked</span></div>' +
    '</div></div>' +
  '</div></div>' +

  '<div class="panel"><div class="panel-head"><span class="label">The spine &mdash; the one thing this console is remembered by</span></div>' +
  '<div class="panel-body">' +
    '<p class="section-note" style="margin-bottom:16px">One continuous rule runs the length of the queue. Every entry is a node on it, in join order. When call-next passes someone, <b>the line itself swerves around them</b> and their node is left detached in ochre. The step-over is geometry, not a badge, because badges are the thing staff stop seeing by week three.</p>' +
    '<ul class="line" style="max-width:820px">' +
      entryRow({id:"ds1",t:"A-106",name:"Novlette Ferguson",ch:"reception",st:"deposit_withdrawal",status:"waiting",at:"09:22",counter:null,survey:null},0,false).replace(/data-act="[^"]*"/g,'data-act="noop"') +
      entryRow({id:"ds2",t:"A-105",name:"Kemar Douglas",ch:"whatsapp",st:"general_enquiry",status:"provisional",at:"09:19",counter:null,survey:null,
        steppedOver:true, steppedOverReason:"Passed for Counter 1 at 09:38. This entry has not been confirmed, so call-next moved to the next confirmed person in line."},1,false).replace(/data-act="[^"]*"/g,'data-act="noop"') +
      entryRow({id:"ds3",t:"A-103",name:"Devon Clarke",ch:"qr",st:"card_services",status:"serving",at:"09:07",counter:"c1",survey:null},2,false).replace(/data-act="[^"]*"/g,'data-act="noop"') +
    '</ul>' +
  '</div></div>' +

  '<div class="panel"><div class="panel-head"><span class="label">State vocabulary &mdash; every screen owes all five</span></div>' +
  '<div class="panel-body tight"><table class="tbl"><thead><tr><th style="width:130px">State</th><th>What the screen does</th><th style="width:30%">Why it is not optional</th></tr></thead><tbody>' +
    '<tr><td class="strong">Live</td><td>Renders API state. The queue in join order, counters showing who they hold.</td><td class="muted">&mdash;</td></tr>' +

    '<tr><td class="strong">Loading</td><td>Skeletons in the exact shape of the rows they replace. No spinner, no layout jump.</td><td class="muted">A clerk on a branch connection sees this state hundreds of times a day.</td></tr>' +
    '<tr><td class="strong">Refusal</td><td>A claret strip in place, stating what happened and what would work instead. Never a modal, never a stack trace.</td><td class="muted">A 409 is an answer. Presenting it as a crash teaches staff to distrust the screen.</td></tr>' +
    '<tr><td class="strong">Degraded</td><td>Dark banner, last-known state dimmed and dated, every write control disabled. The estimate refuses.</td><td class="muted">The one state where the product must say what it does not know, loudly.</td></tr>' +
  '</tbody></table></div></div>' +

  '<div class="panel"><div class="panel-head"><span class="label">Invariant &rarr; the thing on screen that carries it</span></div>' +
  '<div class="panel-body tight"><table class="tbl"><thead><tr><th style="width:90px">Rule</th><th style="width:36%">What it says</th><th>How the design holds it</th></tr></thead><tbody>' +
    '<tr><td class="strong">I1</td><td>Order is join time.</td><td>The line renders in join order and <b>ships no sort control at all</b>. There is no column header to click, so there is no way to arrive at a view that hides the order.</td></tr>' +
    '<tr><td class="strong">I8</td><td>Stepped-over is visible.</td><td>The spine detours around the entry and the node detaches. A full-width note beneath states who was passed, for which counter, at what time, and why &mdash; and carries the two buttons that resolve it.</td></tr>' +
    '<tr><td class="strong">I7</td><td>Out-of-order needs a named approver.</td><td>The only modal in the system. It names the people being passed, and the confirm button is disabled until an approver is chosen and a reason typed. A role is explicitly rejected as an approver.</td></tr>' +
    '<tr><td class="strong">R-G</td><td>Estimate is a range or an honest refusal.</td><td>The rail renders the API string verbatim. The refusal is typeset as an <b>answer</b>, not an empty state, and <code>basis</code> is always shown so a range can be argued with. No component in this file can produce a single number.</td></tr>' +
    '<tr><td class="strong">R-I</td><td>Service types are provisional.</td><td>The disclaimer sits <b>inside</b> the same bordered region as the list, above the items, rendered from <code>provisionalNote</code> in the payload. It travels with the data on all three surfaces that show it.</td></tr>' +
    '<tr><td class="strong">Survey</td><td>Two questions, asked once, never fabricated.</td><td>Half-answered is its own figure and is excluded from both rates. The served table shows "1 of 2 &mdash; left half-answered" as a real outcome rather than rounding it to complete or hiding it.</td></tr>' +
    '<tr><td class="strong">Auth</td><td>Hiding a button is not access control.</td><td>Role tabs change what is <b>offered</b>. Every refusal still has to happen on the API. The Admin views are read-only by design, so an admin cannot reach into a line they cannot see.</td></tr>' +
  '</tbody></table></div></div>' +

  '<div class="panel"><div class="panel-head"><span class="label">Components</span></div>' +
  '<div class="panel-body">' +
    '<div class="spec-row"><div class="label">Buttons</div><div><div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn btn-primary">Primary</button><button class="btn">Default</button>' +
      '<button class="btn btn-ochre">Override</button><button class="btn btn-danger">Destructive</button>' +
      '<button class="btn btn-ghost">Quiet</button><button class="btn" disabled>Disabled</button></div>' +
      '<div class="dense muted" style="margin-top:8px">36px tall, 44px on touch. One primary per screen region.</div></div></div>' +
    '<div class="spec-row"><div class="label">Status</div><div><div style="display:flex;gap:7px;flex-wrap:wrap">' +
      ["provisional","waiting","called","serving","served","noshow","left"].map(k =>
        '<span class="pill pill-' + k + '">' + statusPill({status:k}) + '</span>').join("") + '</div></div></div>' +
    '<div class="spec-row"><div class="label">Refusal</div><div>' +
      '<div class="refusal" style="margin:0">' + ICON.warn +
      '<div><div class="r-title">You cannot complete an entry that is not being served<span class="r-code">HTTP 409</span></div>' +
      '<div>Devon Clarke (A-103) is waiting in line right now. The line is showing you the current state.</div></div></div></div></div>' +
    '<div class="spec-row"><div class="label">Grid</div><div class="dense">Radius 2&ndash;3px throughout. Separation by hairline rule, not shadow. The single elevation in the system is the override modal, because it is the single action that should feel heavier than the rest.</div></div>' +
    '<div class="spec-row"><div class="label">Motion</div><div class="dense">Four movements only: the detour draws in over 560ms when a step-over appears, the called node fills, the refusal strip slides 6px, the modal lifts. Everything is under 240ms except the detour, which is the one moment worth watching. All of it is off under <code>prefers-reduced-motion</code>.</div></div>' +
  '</div></div>' +

  '<div class="panel"><div class="panel-head"><span class="label">What the build still owes (section 6)</span></div>' +
  '<div class="panel-body tight"><table class="tbl"><thead><tr><th style="width:30%">Gap</th><th>Designed through it as</th></tr></thead><tbody>' +
    '<tr><td class="strong">Guest name</td><td>Every row leads with a name and falls back to the ticket number in italics when there is none. Reception join captures it. Needs an additive migration plus the WhatsApp prompt.</td></tr>' +
    '<tr><td class="strong">Prod counters and service types</td><td>Counter labels and service labels are read as data everywhere; Counters and services is the screen that edits them. Needs the gated prod seed.</td></tr>' +
    '<tr><td class="strong">Admin endpoints</td><td>All branches and Comparison assume one cross-branch aggregation call, not a fan-out of per-location calls.</td></tr>' +
    '<tr><td class="strong">Clerk auth</td><td>Three role surfaces exist. Session validation stays server-side; the tabs are convenience, not a boundary.</td></tr>' +
    '<tr><td class="strong">Close of day</td><td>Placed under Manager per the CC recommendation. Flagged as unruled. If it moves, the still-in-line warning moves with it.</td></tr>' +
    '<tr><td class="strong">One prod branch</td><td>Admin is designed against the three local seed branches. Half-Way Tree is the only one marked prod on the plate.</td></tr>' +
  '</tbody></table></div></div>';
}

   scaffolding and are gone. screenDesignSystem above is unreferenced and kept
   only as documentation of the token system. */
