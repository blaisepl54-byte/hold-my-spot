<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hold My Spot — Console</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b23; --line: #232a35; --ink: #e8edf5;
    --dim: #93a0b4; --accent: #35d07f; --wa: #25d366; --qr: #f5a623; --rec: #5b8def;
    --warn: #f5a623; --danger: #ef5b5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header { padding: 18px 24px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--dim); font-size: 13px; }
  .stage { display: grid; grid-template-columns: minmax(0,1fr) 360px; gap: 20px; padding: 20px 24px; align-items: start; }
  @media (max-width: 1000px) { .stage { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .panel h2 { margin: 0; padding: 14px 16px; font-size: 13px; text-transform: uppercase;
              letter-spacing: .08em; color: var(--dim); border-bottom: 1px solid var(--line); }
  .stats { display: flex; gap: 18px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .stat b { display: block; font-size: 20px; }
  .stat span { color: var(--dim); font-size: 12px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .pos { width: 26px; height: 26px; border-radius: 50%; background: #222a36; color: var(--dim);
         display: grid; place-items: center; font-size: 12px; flex: none; }
  .who { flex: 1; min-width: 0; }
  .who .nm { font-weight: 600; }
  .who .sub { color: var(--dim); font-size: 12px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .badge.whatsapp { color: var(--wa); border-color: #1d4a32; }
  .badge.qr { color: var(--qr); border-color: #4a3a1d; }
  .badge.reception { color: var(--rec); border-color: #23345c; }
  .flag { color: var(--warn); font-size: 12px; }
  .unreachable { color: var(--danger); font-size: 12px; }
  button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: #1d232d;
           color: var(--ink); padding: 7px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: #3a4658; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.go { background: var(--accent); border-color: var(--accent); color: #06210f; font-weight: 600; }
  .bar { display: flex; gap: 8px; padding: 12px 16px; flex-wrap: wrap; align-items: center; }
  select, input { font: inherit; background: #10151c; color: var(--ink);
                  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  .counter { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .counter .cn { width: 72px; font-weight: 600; }
  .counter .now { flex: 1; color: var(--dim); font-size: 13px; }
  .phone { background: #0b1a12; border: 1px solid #1d4a32; border-radius: 14px; overflow: hidden; }
  .phone h2 { border-color: #1d4a32; }
  .thread { padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 160px; }
  .msg { background: #123524; border-radius: 10px 10px 10px 2px; padding: 8px 11px; font-size: 13px; max-width: 88%; }
  .msg .meta { color: #6fbf94; font-size: 11px; margin-top: 4px; }
  .empty { color: var(--dim); font-size: 13px; padding: 14px; }
  .log { padding: 10px 16px; font-size: 12px; color: var(--dim); max-height: 220px; overflow: auto; }
  .log div { padding: 3px 0; border-bottom: 1px solid #1b212a; }
  .err { color: var(--danger); padding: 8px 16px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Hold My Spot — Console</h1>
  <p>One queue, two live views. Both sides read and write the same database.
     Remote joins arrive <b>provisional</b> and are skipped by Call Next until the customer confirms.</p>
</header>

<div class="stage">
  <div>
    <div class="panel">
      <h2>Unified queue</h2>
      <div class="stats" id="stats"></div>
      <div class="bar">
        <select id="loc"></select>
        <button onclick="join('reception')">+ Reception</button>
        <button onclick="join('qr')">+ Walk-in QR</button>
        <button onclick="join('whatsapp')">+ WhatsApp (remote)</button>
        <span style="flex:1"></span>
        <button onclick="closeDay()">Close of day</button>
      </div>
      <div id="queue"></div>
      <div class="err" id="err"></div>
    </div>

    <div class="panel" style="margin-top:20px">
      <h2>Counters</h2>
      <div id="counters"></div>
    </div>

    <div class="panel" style="margin-top:20px">
      <h2>Fairness log</h2>
      <div class="log" id="log"></div>
    </div>
  </div>

  <div>
    <div class="panel phone">
      <h2>Customer phone · WhatsApp</h2>
      <div class="thread" id="thread"></div>
      <div class="bar" id="phoneActions"></div>
    </div>
  </div>
</div>

<script type="module">
const COUNTERS = ["Counter 1", "Counter 2", "Counter 3"];
let locationId = null;
let board = { queue: [], totals: { served: 0, noshow: 0, left: 0 }, events: [] };
let inbox = [];
// The phone follows the most recent remote entry, which is the one the demo is about.
let phoneEntryId = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

async function api(path, body) {
  const res = await fetch(path, body ? {
    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
  } : undefined);
  const json = await res.json();
  if (!json.ok) $("err").textContent = json.reason ?? "request failed";
  else $("err").textContent = "";
  return json;
}

async function refresh() {
  if (!locationId) return;
  const b = await api(`/api/board?locationId=${encodeURIComponent(locationId)}`);
  if (b.ok) board = b.value;
  const i = await api(`/api/inbox${phoneEntryId ? `?entryId=${encodeURIComponent(phoneEntryId)}` : ""}`);
  if (i.ok) inbox = i.value;
  render();
}

function inLine() {
  return board.queue.filter((e) => e.status === "provisional" || e.status === "waiting");
}

function render() {
  const line = inLine();
  $("stats").innerHTML = [
    ["In line", line.length],
    ["Unconfirmed", line.filter((e) => e.status === "provisional").length],
    ["Served today", board.totals.served],
    ["No-shows", board.totals.noshow],
    ["Released", board.totals.left],
  ].map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");

  $("queue").innerHTML = line.length === 0
    ? `<div class="empty">Nobody in line.</div>`
    : line.map((e, i) => {
        const prov = e.status === "provisional";
        const unreachable = prov && e.undeliverable_at !== null;
        return `<div class="row">
          <div class="pos">${i + 1}</div>
          <div class="who">
            <div class="nm">${esc(e.id.slice(0, 8))} <span class="badge ${esc(e.channel)}">${esc(e.channel)}</span></div>
            <div class="sub">joined ${new Date(e.joined_at).toLocaleTimeString()}
              ${prov ? `· <span class="flag">provisional — awaiting confirm</span>` : ""}
              ${unreachable ? `· <span class="unreachable">unreachable, prompt failed</span>` : ""}
            </div>
          </div>
          ${prov ? `<button onclick="act('remove','${e.id}')">Remove</button>` : ""}
          ${!prov ? `<button onclick="act('leave','${e.id}')">Left</button>` : ""}
        </div>`;
      }).join("");

  $("counters").innerHTML = COUNTERS.map((c) => {
    const at = board.queue.find((e) => e.counter === c && (e.status === "called" || e.status === "serving"));
    const callable = line.some((e) => e.status === "waiting");
    if (!at) {
      return `<div class="counter"><div class="cn">${c}</div>
        <div class="now">open</div>
        <button class="go" ${callable ? "" : "disabled"} onclick="callNext('${c}')">Call next</button></div>`;
    }
    return `<div class="counter"><div class="cn">${c}</div>
      <div class="now">${at.status} · ${esc(at.id.slice(0, 8))}</div>
      ${at.status === "called" ? `<button onclick="act('check-in','${at.id}')">Check in</button>
                                  <button onclick="act('no-show','${at.id}')">No show</button>
                                  <button onclick="act('undo-call','${at.id}')">Undo</button>` : ""}
      ${at.status === "serving" ? `<button class="go" onclick="act('complete','${at.id}')">Complete</button>` : ""}
    </div>`;
  }).join("");

  $("log").innerHTML = board.events.length === 0
    ? `<div>No events yet.</div>`
    : board.events.map((e) => `<div>${new Date(e.occurred_at).toLocaleTimeString()} ·
        <b>${esc(e.kind)}</b> ${esc(e.from_status ?? "none")} → ${esc(e.to_status ?? "-")}
        ${e.reason ? `· ${esc(e.reason)}` : ""}</div>`).join("");

  const mine = phoneEntryId ? board.queue.find((e) => e.id === phoneEntryId) : null;
  $("thread").innerHTML = inbox.length === 0
    ? `<div class="empty">No messages yet. Join by WhatsApp to see the customer's view.</div>`
    : inbox.map((m) => `<div class="msg">${esc(m.body)}
        <div class="meta">delivered: ${m.delivered ? "yes" : "no"} · attempt ${m.attempt}</div></div>`).join("");

  const pos = mine ? inLine().findIndex((e) => e.id === mine.id) + 1 : 0;
  $("phoneActions").innerHTML = !mine
    ? `<span style="color:var(--dim);font-size:13px">Not in the queue.</span>`
    : `<span style="color:var(--dim);font-size:13px">You are ${pos > 0 ? `#${pos} in line` : mine.status}.</span>
       ${mine.status === "provisional" ? `<button class="go" onclick="act('confirm','${mine.id}')">Confirm my spot</button>` : ""}
       ${mine.status === "called" ? `<button class="go" onclick="act('check-in','${mine.id}')">I'm here</button>` : ""}
       <button onclick="act('leave','${mine.id}')">Leave</button>`;
}

window.join = async (channel) => {
  const body = { locationId, channel };
  if (channel === "whatsapp") body.contact = "+1876555" + String(Math.floor(1000 + Math.random() * 8999));
  const r = await api("/api/join", body);
  if (r.ok && channel === "whatsapp") phoneEntryId = r.value.entryId;
  refresh();
};
window.callNext = async (counter) => { await api("/api/call-next", { locationId, counter }); refresh(); };
window.act = async (verb, entryId) => { await api(`/api/${verb}`, { locationId, entryId }); refresh(); };
window.closeDay = async () => { await api("/api/close-of-day", { locationId }); refresh(); };

async function boot() {
  const locs = await api("/api/locations");
  if (!locs.ok || locs.value.length === 0) {
    $("err").textContent = "No locations exist. Seed one first: npm run seed";
    return;
  }
  $("loc").innerHTML = locs.value.map((l) => `<option value="${l.id}">${esc(l.name)} · ${esc(l.close_of_day_policy)}</option>`).join("");
  locationId = locs.value[0].id;
  $("loc").onchange = (e) => { locationId = e.target.value; phoneEntryId = null; refresh(); };
  refresh();
  setInterval(refresh, 2000);
}
boot();
</script>
</body>
</html>
